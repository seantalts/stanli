name: Restore posteriordb
description: Check out the models, data and posterior list of posteriordb (about 24 MB of its 2 GB) at the pinned SHA, cached on that SHA.
inputs:
  sha:
    description: The posteriordb revision, PDB_SHA from deps/pins.env.
    required: true
runs:
  using: composite
  steps:
    - name: Restore posteriordb (models and data only)
      id: pdb-cache
      uses: actions/cache@v4
      with:
        path: deps/posteriordb
        key: pdb-lite-${{ inputs.sha }}-2
    - name: Fetch posteriordb
      if: steps.pdb-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        PDB_SHA: ${{ inputs.sha }}
      run: |
        tools/with_retry.sh git clone --filter=blob:none --sparse \
          https://github.com/stan-dev/posteriordb.git deps/posteriordb
        git -C deps/posteriordb sparse-checkout set \
          posterior_database/models/stan posterior_database/data/data \
          posterior_database/posteriors
        tools/with_retry.sh git -C deps/posteriordb fetch -q origin "$PDB_SHA"
        git -C deps/posteriordb checkout -q "$PDB_SHA"

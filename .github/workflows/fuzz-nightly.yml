# Run the stanc3 differential fuzzer (tools/fuzz_stanc) every night and open
# an issue for each new correctness bucket. tools/fuzz_stanc/README.md
# describes the job.
#
# The build copies the seed job in clang-ccache-seed.yml and only restores
# its caches: the main Clang ccache, the OCaml switch and the incremental
# stanc3 build. Restoring and never saving keeps this workflow from writing
# a cache entry that another workflow would then restore.
#
# The libfuzzer job runs the runtime's input fuzzers (tests/fuzz). It saves
# a compiler cache of its own, under a key prefix that nothing else restores.
name: nightly stanc3 fuzz

on:
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:
    inputs:
      seeds:
        description: fuzz.py --seeds list, such as 0:500 or 12,40:60 (empty for the nightly list)
        type: string
        default: ''
      file_issues:
        description: open or update issues for new buckets
        type: boolean
        default: true

permissions:
  contents: read
  packages: read

# Two runs at once could both open an issue for the same bucket.
concurrency:
  group: fuzz-nightly
  cancel-in-progress: false

env:
  OPAM_VERSION: 2.5.2

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    container:
      image: ghcr.io/seantalts/stanli-manylinux:2_28-x86_64
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      fuzzed: ${{ steps.fuzz.outcome }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/pins

      - name: Install Clang
        run: manylinux-install-clang

      - name: Fingerprint Clang
        id: toolchain
        shell: bash
        run: |
          fingerprint=$(clang++ --version | sha256sum | cut -d' ' -f1)
          echo "id=$fingerprint" >> "$GITHUB_OUTPUT"

      # Same key as clang-ccache-seed.yml, so a prefix hit reuses main's
      # objects.
      - name: Restore the Clang compiler cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: >-
            ccache-manylinux_2_28_x86_64-release-clang-v6-${{ steps.toolchain.outputs.id }}-${{ hashFiles('CMakeLists.txt', '.github/manylinux/**', '.github/workflows/clang-ccache-seed.yml', '.github/workflows/wheels.yml', 'runtime/**', 'tests/**/*.cpp', 'tests/**/*.hpp', 'tools/**/*.cpp', 'tools/**/*.hpp', 'deps/fetch.sh', 'deps/pins.env') }}
          restore-keys: >-
            ccache-manylinux_2_28_x86_64-release-clang-v6-${{ steps.toolchain.outputs.id }}-

      - name: Restore the vendored dependencies
        uses: actions/cache/restore@v4
        with:
          path: |
            deps/math
            deps/stan
          key: deps-${{ runner.os }}-sources3-${{ hashFiles('deps/pins.env', 'deps/fetch.sh') }}

      - name: Fetch pinned dependencies
        run: ./deps/fetch.sh

      - name: Identify the stanc3 build toolchain
        id: stanc-toolchain
        shell: bash
        run: |
          echo "OPAMROOT=$GITHUB_WORKSPACE/.ci-opam" >> "$GITHUB_ENV"
          fingerprint=$({ cc --version; ld --version; ldd --version; } | sha256sum | cut -d' ' -f1)
          echo "id=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Restore the OCaml toolchain
        uses: actions/cache/restore@v4
        with:
          path: .ci-opam
          key: >-
            stanc-toolchain-v1-manylinux_2_28_x86_64-${{ steps.stanc-toolchain.outputs.id }}-${{ env.STANC3_SRC_SHA }}-ocaml${{ env.OCAML_VERSION }}-opam${{ env.OPAM_VERSION }}-${{ hashFiles('.github/manylinux/**', 'harnesses/conformance/build_stanc.sh', 'tools/dev_setup.sh', 'deps/pins.env') }}

      - name: Restore the incremental stanc3 build
        uses: actions/cache/restore@v4
        with:
          path: deps/stanc3-src
          key: >-
            stanc-dune-v1-manylinux_2_28_x86_64-${{ steps.stanc-toolchain.outputs.id }}-${{ env.STANC3_SRC_SHA }}-ocaml${{ env.OCAML_VERSION }}-opam${{ env.OPAM_VERSION }}-${{ hashFiles('.github/manylinux/**', 'harnesses/conformance/build_stanc.sh', 'tools/dev_setup.sh', 'deps/pins.env') }}-${{ hashFiles('compiler/native/**', 'compiler/ocaml/**', 'tools/stanc_embed/**') }}
          restore-keys: >-
            stanc-dune-v1-manylinux_2_28_x86_64-${{ steps.stanc-toolchain.outputs.id }}-${{ env.STANC3_SRC_SHA }}-ocaml${{ env.OCAML_VERSION }}-opam${{ env.OPAM_VERSION }}-${{ hashFiles('.github/manylinux/**', 'harnesses/conformance/build_stanc.sh', 'tools/dev_setup.sh', 'deps/pins.env') }}-

      - name: Install opam ${{ env.OPAM_VERSION }}
        run: |
          url=https://github.com/ocaml/opam/releases/download
          # manylinux's curl lacks --retry-all-errors.
          for attempt in 1 2 3 4 5; do
            if curl -fsSL -o /tmp/opam \
              "$url/$OPAM_VERSION/opam-$OPAM_VERSION-x86_64-linux"; then
              break
            fi
            [ "$attempt" -lt 5 ] || exit 1
            sleep $((attempt * 2))
          done
          chmod +x /tmp/opam
          sudo install -m 755 /tmp/opam /usr/local/bin/opam 2>/dev/null ||
            install -m 755 /tmp/opam /usr/local/bin/opam
          opam --version

      # The fuzzer runs stanli-compile with --passes, so it needs the
      # standalone compiler, which no cache holds. With the switch and the
      # dune build restored this is an incremental build.
      - name: Build stanli-compile
        run: |
          if [ -d deps/stanc3-src/.git ]; then
            git -C deps/stanc3-src clean -ffd -e _build
          fi
          opam init --bare --disable-sandboxing --no-setup -y
          ./tools/dev_setup.sh --no-embed --no-build
          test -x deps/stanc3/stanli-compile
        env:
          OPAMYES: '1'

      - name: Build stanli_check and bench_grad
        shell: bash
        run: |
          export CC=clang CXX=clang++
          export CCACHE_DIR="$PWD/.ccache" CCACHE_COMPRESS=1 CCACHE_MAXSIZE=600M
          export CCACHE_SLOPPINESS=pch_defines,time_macros,include_file_mtime,include_file_ctime
          ccache -z
          cmake -B build-rel -DCMAKE_BUILD_TYPE=Release \
            -DSTANLI_STAN_DENSITY_ORACLE=OFF \
            -DSTANLI_DEBUG_SWITCHES=OFF \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DSTANLI_EMBED_STANC=OFF
          cmake --build build-rel --target stanli_check bench_grad -j3
          ccache -s

      - name: Choose the seeds
        id: seeds
        env:
          INPUT_SEEDS: ${{ inputs.seeds }}
        run: |
          seeds=$(python3 tools/fuzz_stanc/nightly.py seeds \
            --date "$(date -u +%F)" --override "$INPUT_SEEDS")
          echo "seeds=$seeds" >> "$GITHUB_OUTPUT"
          echo "seeds $seeds"

      - name: Fuzz
        id: fuzz
        timeout-minutes: 75
        env:
          SEEDS: ${{ steps.seeds.outputs.seeds }}
        run: |
          mkdir -p fuzz-run
          start=$(date +%s)
          python3 tools/fuzz_stanc/fuzz.py --seeds "$SEEDS" --jobs "$(nproc)" \
            --retime-seconds 300 \
            --compiler deps/stanc3/stanli-compile \
            --check build-rel/stanli_check --bench build-rel/bench_grad \
            --out fuzz-run > fuzz-run/fuzz.log
          echo $(( $(date +%s) - start )) > fuzz-run/wall_seconds
          cat fuzz-run/summary.txt

      - name: Reduce one program of each new bucket
        continue-on-error: true
        timeout-minutes: 20
        run: |
          python3 tools/fuzz_stanc/nightly.py reduce fuzz-run \
            --compiler deps/stanc3/stanli-compile \
            --check build-rel/stanli_check --bench build-rel/bench_grad \
            --jobs "$(nproc)" --time-limit 300 --max-buckets 3

      - name: Write the job summary
        if: always() && steps.fuzz.outcome == 'success'
        run: python3 tools/fuzz_stanc/nightly.py summary fuzz-run >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the run directory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-run
          path: fuzz-run/
          retention-days: 30

  # libFuzzer on the parsers that read caller input: the BridgeStan
  # manifest's whiten member, the low-rank whitening and sparse-factor
  # arguments, and data JSON. Five minutes per target under ASan and UBSan's
  # signed-integer-overflow check. A crash fails the job and its input is
  # in the uploaded artifact; once fixed, it belongs in tests/fuzz/corpus/,
  # which CTest replays. The runner's own Clang, as in the wheels
  # workflow's asan job: libFuzzer's runtime ships with LLVM's Clang, and
  # Ubuntu's package has it.
  libfuzzer:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/pins

      - name: Install Clang
        run: |
          tools/with_retry.sh sh -c \
            'sudo apt-get update && sudo apt-get install -y clang ccache'

      - name: Fingerprint Clang
        id: toolchain
        run: |
          fingerprint=$(clang++ --version | sha256sum | cut -d' ' -f1)
          echo "id=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Restore the compiler cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: >-
            ccache-libfuzzer-v1-${{ steps.toolchain.outputs.id }}-${{ hashFiles('CMakeLists.txt', 'runtime/**', 'tests/fuzz/**', 'tests/tbb_stub.cpp', 'deps/fetch.sh', 'deps/pins.env') }}
          restore-keys: ccache-libfuzzer-v1-${{ steps.toolchain.outputs.id }}-

      - name: Restore the vendored dependencies
        uses: actions/cache/restore@v4
        with:
          path: |
            deps/math
            deps/stan
          key: deps-${{ runner.os }}-sources3-${{ hashFiles('deps/pins.env', 'deps/fetch.sh') }}

      - name: Fetch pinned dependencies
        run: ./deps/fetch.sh

      # The density kernels peak at about 8 GB each under ASan and
      # libFuzzer's coverage (measured with Homebrew Clang 23 on arm64), so
      # two at once need more than the runner's 16 GB. Swap on the ephemeral
      # disk, as in the wheels workflow's asan job.
      - name: Swap, so a compiler memory spike degrades instead of killing
        run: |
          sudo fallocate -l 8G /mnt/swapfile-fuzz
          sudo chmod 600 /mnt/swapfile-fuzz
          sudo mkswap /mnt/swapfile-fuzz
          sudo swapon /mnt/swapfile-fuzz
          swapon --show && free -h

      - name: Build the fuzz targets
        id: build
        run: |
          export CCACHE_DIR="$PWD/.ccache" CCACHE_COMPRESS=1 CCACHE_MAXSIZE=400M
          cmake -B build-fuzz -DCMAKE_BUILD_TYPE=None \
            -DCMAKE_C_FLAGS="-O1 -g1" -DCMAKE_CXX_FLAGS="-O1 -g1" \
            -DSTANLI_SANITIZE=address,signed-integer-overflow -DSTANLI_FUZZ=ON \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build-fuzz -j2 \
            --target fuzz_manifest fuzz_lowrank fuzz_data
          ccache -s

      - name: Save the compiler cache
        if: >-
          always() && steps.build.outcome == 'success' &&
          steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Fuzz
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1
        run: |
          status=0
          for t in manifest lowrank data; do
            mkdir -p "fuzz-out/$t/corpus"
            dict=
            [ -f "tests/fuzz/$t.dict" ] && dict="-dict=tests/fuzz/$t.dict"
            # New inputs go to the first directory, not the checked-in seeds.
            "build-fuzz/fuzz_$t" -max_total_time=300 -timeout=30 $dict \
              -artifact_prefix="fuzz-out/$t/" \
              "fuzz-out/$t/corpus" "tests/fuzz/corpus/$t" \
              > "fuzz-out/$t/log.txt" 2>&1 || status=1
            tail -n 40 "fuzz-out/$t/log.txt"
          done
          exit $status

      - name: Upload the crash inputs and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libfuzzer-run
          path: |
            fuzz-out/*/log.txt
            fuzz-out/*/crash-*
            fuzz-out/*/timeout-*
            fuzz-out/*/oom-*
          if-no-files-found: ignore
          retention-days: 30

  # A separate job so that the job running generated programs never holds a
  # token that can write issues. The runner image has gh.
  report:
    needs: fuzz
    if: always() && needs.fuzz.outputs.fuzzed == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: fuzz-run
          path: fuzz-run

      - name: Open or update an issue for each new bucket
        if: github.event_name == 'schedule' || inputs.file_issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/fuzz_stanc/nightly.py file fuzz-run \
            --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      # Fails on harness errors, on a run where too few programs agree to
      # trust the tools, and on new correctness buckets. After filing, only
      # buckets that got a new issue count, so an open issue keeps later
      # nights green.
      - name: Gate on correctness buckets
        run: python3 tools/fuzz_stanc/nightly.py gate fuzz-run

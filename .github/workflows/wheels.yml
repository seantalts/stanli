# Build the platform wheels, and publish them to PyPI on a version tag.
#
# Pull requests build the representative manylinux target with Clang, compile
# the runtime for wasm32, run the full runtime and corpus tests, and gate the
# bounded Windows compiler cross-build. Shipped Linux and Windows builds retain
# their established GCC toolchains. Every release target also builds after
# merge, nightly, and on version tags; publishing is gated on the tag and all
# of those builds.
#
# Not cibuildwheel: it exists to build one wheel per CPython version, and
# stanli ships a ctypes-loaded shared library with no extension module, so
# there is exactly one py3-none-<platform> wheel per platform.
#
# Windows builds under mingw-w64 (stan-math does not build under MSVC,
# which is why RStan ships through RTools), exports the C ABI through a
# .def file, and bundles exact-source stock and stanli compiler executables as
# subprocesses. Keeping the compilers in separate processes avoids introducing
# a Windows OCaml DLL ABI and isolates compiler state from the sampler. That job
# does not run on pull requests: mingw compiles the density kernels an
# order of magnitude slower than every other platform (110 minutes for
# that one translation unit against ~7 for the other 140 targets), so
# gating merges on it means waiting hours for a signal that has never
# caught a bug the other five platforms missed. It runs after the merge
# instead, nightly, and on release tags, where a failure is a bug report
# rather than a roadblock. Publishing still waits for it.
name: wheels

on:
  push:
    branches: [main]
    tags: ['v*', 'npm-v*']
  pull_request:
  schedule:
    # 08:00 UTC daily, which is overnight in US time zones.
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

# One run per branch. Pushing twice to a pull request used to leave both
# runs alive, competing for the same macOS runners, so the run that
# actually gates the merge started last and finished last -- four stale
# runs had to be cancelled by hand on one branch.
#
# cancel-in-progress is deliberately conditional. A superseded PR run is
# worthless, but a push to main is what the nightly-vs-release history is
# read from, and a tag build is a release: neither may be cancelled by
# whatever lands next. github.ref distinguishes them, and the group is
# per-ref so a PR never cancels main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Must match tools/dev_setup.sh. The embedded compiler cache is keyed on
  # the commit, so bumping it there and here invalidates the cache once.
  STANC3_SRC_REPO: https://github.com/stan-dev/stanc3.git
  STANC3_SRC_SHA: 5b824ee48c590fa229dcebf6b57457b2fd212aa8
  OCAML_VERSION: 5.5.0
  OPAM_VERSION: 2.5.2
  # Must match tools/dev_setup.sh; pins the corpus the reference check reads.
  PDB_SHA: 28f8d3d6e975315f42aa274a8399f21e07a43b30

jobs:
  # Keep the required workflow present on every PR, but distinguish changes
  # whose only meaningful validation is the generated-document check. This is
  # deliberately an allowlist: an unfamiliar path gets the full build.
  changes:
    name: classify changed files
    runs-on: ubuntu-latest
    outputs:
      heavy: ${{ steps.scope.outputs.heavy }}
      vectorize: ${{ steps.scope.outputs.vectorize }}
    steps:
      - uses: actions/checkout@v4
      - name: Select the validation scope
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          heavy=true
          vectorize=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            changed_files="$RUNNER_TEMP/stanli-changed-files"
            git diff --no-renames --name-only "$BASE_SHA" HEAD \
              > "$changed_files"
            heavy=false
            vectorize=false
            while IFS= read -r path; do
              case "$path" in
                README.md|TESTING.md|CHANGELOG.md|THIRD_PARTY_LICENSES.md|LICENSE|docs/*.md|web/index.html)
                  ;;
                *)
                  heavy=true
                  ;;
              esac
              # Gate the MIR vectorization A/B check on compiler/runtime/harness changes.
              # It must run whenever anything that could affect lowering or the MIR
              # output might have changed, to catch silent semantic drift.
              case "$path" in
                compiler/**|runtime/**|harnesses/vectorize_ab.py|tools/stanc_embed/**|tools/dev_setup.sh|CMakeLists.txt|deps/fetch.sh|.github/workflows/wheels.yml)
                  vectorize=true
                  ;;
              esac
            done < "$changed_files"
          fi
          echo "heavy=$heavy" | tee -a "$GITHUB_OUTPUT"
          echo "vectorize=$vectorize" | tee -a "$GITHUB_OUTPUT"

  # This is intentionally independent of the compiled runtime. In particular,
  # generated prose and the web index should not need a 30-minute C++ build to
  # prove that their measured tables and markers are current.
  static_checks:
    name: static project checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python3 -m pip install --disable-pip-version-check 'readme_renderer[md]'
      - run: python3 tools/gen_docs.py --check
      - name: Check static packaging inputs
        run: test -s LICENSE && test -s THIRD_PARTY_LICENSES.md
      - name: Check portable build parallelism
        shell: bash
        run: |
          source tools/build_jobs.sh
          test "$(_stanli_cap_jobs_by_memory 32 103079215104 4294967296)" = 24
          test "$(_stanli_cap_jobs_by_memory 32 17179869184 6442450944)" = 2
          test "$(_stanli_cap_jobs_by_memory 32 8589934592 6442450944)" = 1
          test "$(_stanli_cap_jobs_by_memory 2 103079215104 4294967296)" = 2
          test "$(_stanli_cap_jobs_by_memory 32 34359738368 12884901888)" = 2
          test "$(_stanli_smaller_memory_limit \
            17179869184 18446744073709551615)" = 17179869184
          detected_jobs=$(tools/build_jobs.sh)
          test "$detected_jobs" -ge 1
          test "$detected_jobs" -le "$(getconf _NPROCESSORS_ONLN)"
          echo "selected $detected_jobs jobs on this Linux runner"
      - name: Check the browser modules' syntax
        shell: bash
        run: |
          inline="$RUNNER_TEMP/stanli-index-inline.mjs"
          sed -n '/^<script type="module">$/,/^<\/script>$/p' \
            web/index.html | sed '1d;$d' > "$inline"
          test -s "$inline"
          node --check "$inline"
          node --check web/index.mjs

  build:
    name: build (${{ matrix.plat }})
    needs: changes
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.heavy == 'true'
    runs-on: ${{ matrix.os }}
    container:
      image: ${{ matrix.container }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      # CMake reads this, so the library's minimum OS matches the version
      # the wheel tag promises. Without it the runner's own OS version
      # becomes the floor and the tag quietly lies.
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_target }}
    strategy:
      fail-fast: false
      # A pull request builds one platform, and it is Linux x86_64. It
      # runs the test suite and the corpus oracle, which is what has ever
      # caught anything. It is not the mac: on identical work the arm64
      # runner took 49.8 min against this container's 30.1 while the
      # container was pinned to -j1, so it is the slowest machine here,
      # not the fastest. It only looked quick on docs-only runs, where
      # the build is a cache hit and the two minutes are fixed overhead.
      # The other three platforms build after the merge, nightly and on
      # tags, where a break is fixed forward the way Windows already is.
      matrix:
        include: >-
          ${{ fromJSON(github.event_name == 'pull_request'
              && '[{"os":"ubuntu-24.04","plat":"manylinux_2_28_x86_64","container":"ghcr.io/seantalts/stanli-manylinux:2_28-x86_64","opam_arch":"x86_64-linux","build_jobs":2,"runtime":"linux-x86_64"}]'
              || '[{"os":"macos-15","plat":"macosx_11_0_arm64","macos_target":"11.0","opam_arch":"arm64-macos","build_jobs":4,"runtime":"darwin-arm64"},{"os":"macos-15-intel","plat":"macosx_10_15_x86_64","macos_target":"10.15","opam_arch":"x86_64-macos","build_jobs":4,"runtime":"darwin-x86_64"},{"os":"ubuntu-24.04","plat":"manylinux_2_28_x86_64","container":"ghcr.io/seantalts/stanli-manylinux:2_28-x86_64","opam_arch":"x86_64-linux","build_jobs":2,"runtime":"linux-x86_64"},{"os":"ubuntu-24.04-arm","plat":"manylinux_2_28_aarch64","container":"ghcr.io/seantalts/stanli-manylinux:2_28-aarch64","opam_arch":"arm64-linux","build_jobs":2,"runtime":"linux-arm64"}]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Clang frontend (pull requests)
        if: matrix.container != '' && github.event_name == 'pull_request'
        run: |
          # The custom manylinux image already contains every fixed build
          # package. Only PR validation adds Clang's frontend; release,
          # scheduled, and manual builds retain the image's GCC frontend.
          manylinux-install-clang
          echo 'CC=clang' >> "$GITHUB_ENV"
          echo 'CXX=clang++' >> "$GITHUB_ENV"

      - name: Fingerprint the selected C++ compiler
        id: toolchain
        shell: bash
        run: |
          compiler="${CXX:-c++}"
          if command -v sha256sum >/dev/null; then
            fingerprint=$("$compiler" --version | sha256sum | cut -d' ' -f1)
          else
            fingerprint=$("$compiler" --version | shasum -a 256 | cut -d' ' -f1)
          fi
          echo "id=$fingerprint" >> "$GITHUB_OUTPUT"

      # The compiled objects from the last compatible build. stan-math-heavy
      # translation units dominate the wall clock. Keying on compile inputs
      # instead of the commit lets a docs-only PR exact-hit main's cache and
      # avoids writing another ~500 MB archive to the PR-only cache scope.
      # Keep the Clang namespace and hash inputs in sync with
      # clang-ccache-seed.yml: that trusted main-only workflow is what makes
      # the first build of a brand-new PR warm.
      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: >-
            ccache-${{ matrix.plat }}-${{ github.event_name == 'pull_request' && 'release-clang-v6' || 'release-v4' }}-${{ steps.toolchain.outputs.id }}-${{ github.event_name == 'pull_request' && hashFiles('CMakeLists.txt', '.github/manylinux/**', '.github/workflows/clang-ccache-seed.yml', '.github/workflows/wheels.yml', 'runtime/**', 'tests/**/*.cpp', 'tests/**/*.hpp', 'tools/**/*.cpp', 'tools/**/*.hpp', 'deps/fetch.sh') || hashFiles('CMakeLists.txt', 'runtime/**', 'tests/**/*.cpp', 'tests/**/*.hpp', 'tools/**/*.cpp', 'tools/**/*.hpp', 'deps/fetch.sh') }}
          restore-keys: ccache-${{ matrix.plat }}-${{ github.event_name == 'pull_request' && 'release-clang-v6' || 'release-v4' }}-${{ steps.toolchain.outputs.id }}-

      - name: System packages (macOS)
        if: matrix.container == ''
        run: |
          brew list cmake >/dev/null 2>&1 || brew install cmake
          brew list ccache >/dev/null 2>&1 || brew install ccache

      # Not the runner's system python: Homebrew marks it externally
      # managed, so pip refuses to install the build tooling into it.
      - uses: actions/setup-python@v5
        if: matrix.container == ''
        with:
          python-version: '3.12'

      - name: Build tooling
        run: python3 -m pip install --upgrade pip setuptools wheel


      # Everything fetch.sh pulls is pinned by a git SHA, so these two source
      # trees are a pure function of the script. Compiler products under
      # deps/stanc3 have a separate owner and must never ride in this archive:
      # an older archive can otherwise overwrite a correctly keyed embedded
      # object when the cache actions restore in the wrong order.
      - name: Restore the vendored dependencies
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: |
            deps/math
            deps/stan
          key: deps-${{ runner.os }}-sources3-${{ hashFiles('deps/fetch.sh') }}

      - name: Vendored dependencies
        run: |
          setup_repo=$(sed -n 's/^STANC3_SRC_REPO=\([^ ]*\).*/\1/p' \
                         tools/dev_setup.sh)
          setup_pin=$(sed -n 's/^STANC3_SRC_SHA=\([0-9a-f]*\).*/\1/p' \
                        tools/dev_setup.sh)
          test "$setup_repo" = "$STANC3_SRC_REPO"
          test "$setup_pin" = "$STANC3_SRC_SHA"
          ./deps/fetch.sh

      # Restore this after every broader dependency archive. The order is a
      # second line of defense in addition to giving deps/stanc3 exactly one
      # cache owner. A hit skips the expensive opam/source build below; the
      # caml headers accompany it because no opam switch then exists.
      - name: Restore the embedded stanc3 object
        id: stanc-cache
        uses: actions/cache@v4
        with:
          path: |
            deps/stanc3/stanc_embed.o
            deps/stanc3/stanc_embed.o.stamp
            deps/stanc3/stanc
            deps/stanc3/stanc.src
            deps/stanc3/stanli-vectorize-probe
            deps/stanc3/stanli-vectorize-probe.stamp
            deps/ocaml-include
          key: >-
            stanc-embed-v2-${{ matrix.plat }}-${{ env.STANC3_SRC_SHA }}-ocaml${{ env.OCAML_VERSION }}-${{ hashFiles('compiler/native/**', 'compiler/ocaml/**', 'tools/stanc_embed/**') }}

      # The pinned release binary, not install.sh: the installer prompts for
      # its target directory and takes no positional argument, so it is not
      # usable unattended. A warm artifact cache does not need opam at all.
      - name: opam ${{ env.OPAM_VERSION }}
        if: steps.stanc-cache.outputs.cache-hit != 'true'
        run: |
          url=https://github.com/ocaml/opam/releases/download
          curl -fsSL -o /tmp/opam \
            "$url/$OPAM_VERSION/opam-$OPAM_VERSION-${{ matrix.opam_arch }}"
          chmod +x /tmp/opam
          sudo install -m 755 /tmp/opam /usr/local/bin/opam 2>/dev/null ||
            install -m 755 /tmp/opam /usr/local/bin/opam
          opam --version

      - name: Build the embedded stanc3 object
        if: steps.stanc-cache.outputs.cache-hit != 'true'
        run: |
          # The stanc-embed cache missed, so any object on disk came from
          # another cache and is stale by definition.
          rm -f deps/stanc3/stanc_embed.o deps/stanc3/stanc_embed.o.stamp \
            deps/stanc3/stanc deps/stanc3/stanc.src \
            deps/stanc3/stanli-vectorize-probe \
            deps/stanc3/stanli-vectorize-probe.stamp
          opam init --bare --disable-sandboxing --no-setup -y
          ./tools/dev_setup.sh --embed --no-build
          mkdir -p deps/ocaml-include
          cp -R "$(opam var lib --switch=stanc3-55)/ocaml/caml" \
                deps/ocaml-include/
        env:
          OPAMYES: '1'

      - name: Validate the embedded stanc3 object
        shell: bash
        run: |
          source tools/stanc_embed/provenance.sh
          stanc_embed_artifact_matches deps/stanc3/stanc_embed.o \
            "$STANC3_SRC_SHA" stanc3-55
          test -x deps/stanc3/stanli-vectorize-probe
          stanc_embed_artifact_matches \
            deps/stanc3/stanli-vectorize-probe \
            "$STANC3_SRC_SHA" stanc3-55
          for symbol in caml_c_thread_register caml_c_thread_unregister; do
            nm -g deps/stanc3/stanc_embed.o | awk -v wanted="$symbol" '
              ($NF == wanted || $NF == "_" wanted) &&
                  $(NF - 1) ~ /^[Tt]$/ { found = 1 }
              END { exit found ? 0 : 1 }
            ' || {
              echo "embedded compiler lacks ${symbol}" >&2
              exit 1
            }
          done

      - name: Check the fixture corpus matches the pinned stanc
        if: matrix.container != ''
        shell: bash
        run: |
          cp -a tests/fixtures "$RUNNER_TEMP/fixtures-before"
          ./tools/gen_fixtures.sh
          if ! diff -rq "$RUNNER_TEMP/fixtures-before" tests/fixtures; then
            echo "tests/fixtures is stale against deps/stanc3/stanc." >&2
            echo "Run tools/gen_fixtures.sh and commit the result." >&2
            exit 1
          fi

      - name: Configure and build
        run: |
          # $PWD, not github.workspace: inside the manylinux containers the
          # workspace mounts at a different path than the expression gives.
          export CCACHE_DIR="$PWD/.ccache" CCACHE_COMPRESS=1 CCACHE_MAXSIZE=600M
          # The PCH is regenerated after every checkout. Ignore its file times
          # while still hashing header contents, or every PCH consumer misses
          # the restored cache even when its compile inputs are unchanged.
          export CCACHE_SLOPPINESS=pch_defines,time_macros,include_file_mtime,include_file_ctime
          ccache -z
          compiler_args=()
          if [ -n "${CC:-}" ] && [ -n "${CXX:-}" ]; then
            compiler_args+=("-DCMAKE_C_COMPILER=$CC" "-DCMAKE_CXX_COMPILER=$CXX")
          fi
          cmake -B build-rel -DCMAKE_BUILD_TYPE=Release \
            "${compiler_args[@]}" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DSTANLI_STANC_EMBED_OBJ="$PWD/deps/stanc3/stanc_embed.o" \
            -DSTANLI_OCAML_STDLIB="$PWD/deps/ocaml-include"
          # Bounded, not bare -j. The containers ran at -j1 because one
          # densities.cpp compile peaked at 7.57 GB, so two at once
          # OOM-killed a 16 GB runner (exit 137). Sharded, the largest
          # shard is 3.89 GB and -j3 worst-cases at 9.0 GB. Printing what
          # the runner actually has, so the next person tuning this reads
          # it off a log instead of guessing.
          cores=$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo '?')
          gb=$(free -g 2>/dev/null | awk '/^Mem/{print $2}')
          echo "runner: $cores cores, ${gb:-?} GB, building -j${{ matrix.build_jobs }}"
          # What the biggest single compile actually costs on THIS
          # toolchain, because guessing it from another one is what put
          # exit 137 back in the log. GNU time reports the largest child,
          # not the sum, which is exactly the number -j has to fit.
          # Linux only: BSD time on macOS spells the same thing -l.
          if [ "$(uname -s)" = Linux ] && [ -x /usr/bin/time ]; then
            /usr/bin/time -v cmake --build build-rel \
              -j ${{ matrix.build_jobs }} 2>/tmp/build.err ||
              { cat /tmp/build.err; exit 1; }
            # A cache-hit build compiles nothing and reports a peak of
            # about 170 MB, which is not headroom and must not be read as
            # any. Qualify the number with the miss count so nobody
            # raises -j off a run that never ran the compiler.
            kb=$(awk '/[Mm]aximum resident/ {print $NF}' /tmp/build.err)
            miss=$(ccache -s | awk '
              tolower($0) ~ /misses:|cache miss/ {
                for (i = 1; i <= NF; ++i)
                  if ($i ~ /^[0-9]+$/) { print $i; exit }
              }')
            echo "peak RSS $(( kb / 1024 )) MB on the largest single" \
                 "compile, over ${miss:-?} ccache misses" \
                 "$([ "${miss:-0}" -lt 20 ] && echo '(cached build:' \
                 'this peak is not a memory ceiling)')"
          else
            cmake --build build-rel -j ${{ matrix.build_jobs }}
          fi
          ccache -s

      - name: Tests
        run: >-
          ctest --test-dir build-rel
          --parallel ${{ matrix.build_jobs }} --output-on-failure

      # The models and data the corpus check reads: ~24 MB out of
      # posteriordb's 2 GB, via sparse checkout, cached on the pinned SHA.
      - name: Restore posteriordb (models and data only)
        id: pdb-cache
        uses: actions/cache@v4
        with:
          path: deps/posteriordb
          key: pdb-lite-${{ env.PDB_SHA }}-2
      - name: Fetch posteriordb
        if: steps.pdb-cache.outputs.cache-hit != 'true'
        run: |
          git clone --filter=blob:none --sparse \
            https://github.com/stan-dev/posteriordb.git deps/posteriordb
          git -C deps/posteriordb sparse-checkout set \
            posterior_database/models/stan posterior_database/data/data \
            posterior_database/posteriors
          git -C deps/posteriordb fetch -q origin "$PDB_SHA"
          git -C deps/posteriordb checkout -q "$PDB_SHA"

      # Every model the demo page offers has a hand written description,
      # and nothing else on its card is typed. This is the part of that
      # contract a runner can check without a browser.
      - name: Every demo model has a description
        run: python3 tools/gen_web_models.py --check

      # The strongest oracle in the project: every referenced posteriordb
      # model evaluated and compared against CmdStan's recorded lp and full
      # gradient (docs/corpus-refs.json.gz, written by the local rig).
      # This class of check has caught what unit tests missed: eight
      # models silently wrong by up to 1.7e5 relative reached main with
      # every test green, and only the corpus diff flagged them.
      #
      # Every model runs at all three deterministic points, and every
      # point carries its own reference. The recorder used to stop at the
      # first point that works, which selects away from the points where
      # anything is wrong: that is how reductions_allowed segfaulted at
      # point 2 through a month of green runs, and a wrong-but-finite
      # gradient at an unreferenced point had nothing to be wrong
      # against. There is no faster mode to pick instead: a strict mode
      # nobody runs is the failure this replaces. Wall time 26s -> 77s at
      # --jobs 4 on the development machine, and nn_rbm1bJ100's three
      # points ARE that wall clock: the other 128 models total about 25
      # seconds between them.
      - name: Corpus verification against CmdStan references
        run: |
          python3 tools/verify_refs.py deps/posteriordb \
            --check build-rel/stanli_check --jobs 4

      # This does not select the candidate source pass for any producer. The
      # test-only OCaml probe emits both inputs, and stanli_check consumes the
      # saved portable MIR directly so every point reuses the exact bytes.
      # Semantic/reference parity gates the job; graph sizes, re-roll
      # dispositions, and preparation timings are published as measurements.
      #
      # Gated on compiler/runtime/harness changes to avoid 79s overhead on every
      # PR, especially docs-only ones. The check catches silent semantic drift
      # from lowering and source-pass changes, so it must run on anything that
      # could alter MIR or the compiled output; see changes.vectorize for paths.
      - name: Bounded MIR vectorization A/B
        if: >-
          matrix.runtime == 'linux-x86_64' &&
          (github.event_name != 'pull_request' ||
           needs.changes.outputs.vectorize == 'true')
        timeout-minutes: 15
        shell: bash
        run: |
          test -x deps/stanc3/stanli-vectorize-probe
          source tools/stanc_embed/provenance.sh
          stanc_embed_artifact_matches \
            deps/stanc3/stanli-vectorize-probe \
            "$STANC3_SRC_SHA" stanc3-55
          python3 harnesses/vectorize_ab.py deps/posteriordb \
            normal_mixture radon_pooled soil_incubation arK \
            low_dim_gauss_mix hmm_example \
            eight_schools_noncentered \
            --compiler deps/stanc3/stanli-vectorize-probe \
            --check build-rel/stanli_check \
            --bench build-rel/bench_grad --dump build-rel/dump_ops \
            --timeout 30 --gradient-timeout 20 --prep-samples 2 \
            --output-dir build-rel/vectorize-ab

      - name: Publish MIR vectorization measurements
        if: always() && matrix.runtime == 'linux-x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: mir-vectorization-measurements
          if-no-files-found: error
          path: build-rel/vectorize-ab

      - name: Wheel
        run: ./tools/build_wheel.sh

      # build_wheel.sh measures the size breakdown just before it strips
      # the library, into a checkout this job then throws away. Publish it,
      # or the only moment it can be measured produces nothing anyone can
      # read. One platform: the attribution is the same everywhere and the
      # manylinux build is the one the README's totals describe.
      - name: Publish the binary size breakdown
        if: matrix.runtime == 'linux-x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: binary-size
          if-no-files-found: error
          path: docs/binary-size.md

      # The tag is a promise about the oldest system the library runs on,
      # and nothing so far has checked it. glibc is the only versioned
      # dependency left after the static C++ runtime, so the highest
      # GLIBC_* symbol the library imports is the whole answer.
      - name: The manylinux tag is true
        if: matrix.container != ''
        run: |
          so=python/stanli/_bin/libstanli.so
          need=$(objdump -T "$so" | grep -o 'GLIBC_[0-9.]*' |
                 sort -uV | tail -1)
          echo "highest glibc symbol required: $need"
          [ "$(printf '%s\nGLIBC_2.28\n' "$need" | sort -V | tail -1)" \
            = GLIBC_2.28 ]
          ! objdump -T "$so" | grep -q GLIBCXX_ ||
            { echo "dynamic libstdc++ leaked into the library"; exit 1; }
          ldd "$so"

      # Same question on macOS: the deployment target has to match the tag,
      # or the wheel installs on machines that cannot dlopen it.
      - name: The macOS tag is true
        if: matrix.container == ''
        run: |
          dylib=python/stanli/_bin/libstanli.dylib
          got=$(otool -l "$dylib" |
                awk '/LC_BUILD_VERSION/,/minos/ {if ($1=="minos") print $2}' |
                head -1)
          echo "minos $got, tag promises $MACOSX_DEPLOYMENT_TARGET"
          [ "$got" = "$MACOSX_DEPLOYMENT_TARGET" ]

      # The library is the whole wheel; these tests prove it loads, samples,
      # and fails the way the API promises.
      - name: Install the wheel and run the Python tests
        run: |
          python3 -m venv /tmp/wheeltest
          /tmp/wheeltest/bin/pip install dist/*.whl
          /tmp/wheeltest/bin/python tests/test_python.py
          # The BridgeStan transport: the manifest embedded in the data
          # argument, two models through the one dlopen'd runtime library.
          /tmp/wheeltest/bin/python tests/test_bridgestan_embed.py

      # Exercise the real OCaml producer against the exact-source legacy
      # compiler, then compare the decoded program and the executable graph.
      # The normal C++ test has a test-only writer so it can run without an
      # OCaml toolchain; this closes the producer/schema drift gap in CI.
      - name: Typed producer matches exact-source legacy MIR
        if: matrix.runtime == 'linux-x86_64'
        run: |
          cp tests/fixtures/es.stan /tmp/stanli-portable-es.stan
          cp tests/fixtures/view_udf_local_data_branch.stan \
            /tmp/stanli-portable-nested-udf.stan
          cp tests/stanc3/mother.stan /tmp/stanli-portable-mother.stan
          deps/stanc3/stanc --O1 --debug-optimized-mir \
            /tmp/stanli-portable-es.stan > /tmp/stanli-es.legacy-mir
          deps/stanc3/stanc --O1 --debug-optimized-mir \
            /tmp/stanli-portable-nested-udf.stan \
            > /tmp/stanli-nested-udf.legacy-mir
          deps/stanc3/stanc --O1 --debug-optimized-mir \
            /tmp/stanli-portable-mother.stan \
            > /tmp/stanli-mother.legacy-mir
          /tmp/wheeltest/bin/python - <<'PY'
          from pathlib import Path
          import stanli

          models = {
              "es": Path("tests/fixtures/es.stan"),
              "nested-udf": Path("tests/fixtures/view_udf_local_data_branch.stan"),
              "mother": Path("tests/stanc3/mother.stan"),
          }
          for name, path in models.items():
              portable = stanli.stan_to_mir(path.read_text())
              assert portable.startswith("STANLI2:")
              assert not portable.endswith(("\n", "\r"))
              Path(f"/tmp/stanli-{name}.portable-mir").write_text(
                  portable, encoding="ascii")
          PY
          build-rel/test_mir_decode \
            /tmp/stanli-es.legacy-mir /tmp/stanli-es.portable-mir
          build-rel/test_mir_decode --program-only \
            /tmp/stanli-nested-udf.legacy-mir \
            /tmp/stanli-nested-udf.portable-mir
          build-rel/test_mir_decode --program-only \
            /tmp/stanli-mother.legacy-mir \
            /tmp/stanli-mother.portable-mir

      - name: Measure portable MIR size and preparation cost
        if: matrix.runtime == 'linux-x86_64'
        shell: bash
        run: |
          set -euo pipefail
          {
            wc -c /tmp/stanli-es.legacy-mir \
              /tmp/stanli-es.portable-mir
            gzip -c /tmp/stanli-es.legacy-mir | wc -c
            gzip -c /tmp/stanli-es.portable-mir | wc -c
            legacy_decode=$(build-rel/bench_mir_decode \
              /tmp/stanli-es.legacy-mir 51)
            portable_decode=$(build-rel/bench_mir_decode \
              /tmp/stanli-es.portable-mir 51)
            echo "$legacy_decode"
            echo "$portable_decode"
            legacy_ns=$(sed -n 's/.*median_ns=\([0-9]*\).*/\1/p' \
              <<<"$legacy_decode")
            portable_ns=$(sed -n 's/.*median_ns=\([0-9]*\).*/\1/p' \
              <<<"$portable_decode")
            legacy_bytes=$(wc -c < /tmp/stanli-es.legacy-mir)
            portable_bytes=$(wc -c < /tmp/stanli-es.portable-mir)
            [[ "$legacy_ns" =~ ^[0-9]+$ && "$portable_ns" =~ ^[0-9]+$ ]]
            if ((portable_ns * 2 > legacy_ns)); then
              echo "compact MIR median decode is not at least 2x faster" >&2
              exit 1
            fi
            if ((portable_bytes * 2 > legacy_bytes)); then
              echo "compact MIR is not at least 2x smaller" >&2
              exit 1
            fi
            for format in legacy portable; do
              for sample in 1 2 3 4 5; do
                echo "format=$format sample=$sample"
                STANLI_PROFILE_PREP=1 build-rel/bench_grad \
                  "/tmp/stanli-es.${format}-mir" \
                  tests/fixtures/eight_schools.json --prep
              done
            done
          } 2>&1 | tee /tmp/portable-mir-measurements.txt

      - uses: actions/upload-artifact@v4
        if: matrix.runtime == 'linux-x86_64'
        with:
          name: portable-mir-measurements
          path: /tmp/portable-mir-measurements.txt

      # The one check that a second implementation makes and stanli's own
      # tests cannot: the facade and its tests come from the same head, so
      # they can agree on a wrong reading of what a bs_ call means.
      # Reference BridgeStan compiles the same models with a C++
      # toolchain -- which this runner has and stanli's users never do --
      # and both libraries answer through the same client.
      #
      # Linux only. It costs a stan-math compile per model, and the bugs
      # it looks for are in stanli's semantics, which do not vary by
      # platform; the numeric agreement that does vary is already covered
      # per-platform by the corpus oracle.
      #
      # bridgestan is intentionally unpinned here (see below), so the two
      # cache steps that follow key on the RESOLVED version captured by
      # this step's output, never on a version string written in this
      # file -- a hardcoded key would silently keep serving a stale cache
      # after PyPI resolves a new bridgestan release.
      - name: Install reference BridgeStan
        id: bs-pkg
        if: matrix.plat == 'manylinux_2_28_x86_64'
        run: |
          /tmp/wheeltest/bin/pip install bridgestan
          version=$(/tmp/wheeltest/bin/python \
            -c 'import bridgestan; print(bridgestan.__version__)')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # bridgestan.download.get_bridgestan_src() always unpacks to
      # ~/.bridgestan/bridgestan-<version> -- it ignores $BRIDGESTAN,
      # which only steers where the *compiler* looks, not the download --
      # so that is what gets cached. The directory holds the vendored
      # stan-math source tree and, after the first model compile below,
      # BridgeStan's own bridge objects and its built TBB/sundials
      # libraries: infrastructure shared by all four models and rebuilt
      # from scratch every run today. Keyed on the resolved version only
      # -- this is BridgeStan's OWN vendored stan-math (a released
      # tarball, pinned by BridgeStan, not by this repo), so it must never
      # key on deps/math: the two stan-maths are unrelated checkouts, and
      # a deps/math bump here would just evict a cache entry that was
      # never invalidated in the first place.
      - name: Restore BridgeStan sources and shared build objects
        if: matrix.plat == 'manylinux_2_28_x86_64'
        uses: actions/cache@v4
        with:
          path: ~/.bridgestan
          key: >-
            bridgestan-src-${{ runner.os }}-${{ steps.bs-pkg.outputs.version }}

      # The per-model outputs of BridgeStan's own Makefile: the stanc-
      # generated .hpp, the compiled .o, and the linked _model.so, all
      # written next to the .stan file (see
      # bridgestan.compile.generate_so_name). All three are gitignored
      # (tests/fixtures/*.hpp, *.o, *_model.so) and all three need to
      # land together, or `make` finds a prerequisite missing and rebuilds
      # it -- and whatever depends on it -- right along with it. Keyed on
      # the four fixtures' own contents plus the resolved version and
      # platform; deps/math never enters this compile either, for the
      # same reason as the cache above.
      - name: Restore compiled BridgeStan conformance models
        id: bs-models
        if: matrix.plat == 'manylinux_2_28_x86_64'
        uses: actions/cache@v4
        with:
          path: |
            tests/fixtures/es.hpp
            tests/fixtures/es.o
            tests/fixtures/es_model.so
            tests/fixtures/simp.hpp
            tests/fixtures/simp.o
            tests/fixtures/simp_model.so
            tests/fixtures/newtrans.hpp
            tests/fixtures/newtrans.o
            tests/fixtures/newtrans_model.so
            tests/fixtures/conj.hpp
            tests/fixtures/conj.o
            tests/fixtures/conj_model.so
          key: >-
            bridgestan-models-${{ matrix.plat }}-${{ steps.bs-pkg.outputs.version }}-${{ hashFiles('tests/fixtures/es.stan', 'tests/fixtures/simp.stan', 'tests/fixtures/newtrans.stan', 'tests/fixtures/conj.stan') }}

      # actions/cache extracts with the mtimes the archive was saved with,
      # not the extraction time -- so a restored .hpp/.o/.so trio carries
      # LAST run's timestamps, while checkout just gave the .stan files
      # THIS run's. Left alone, make sees the source as newer than
      # everything downstream of it and rebuilds the whole per-model
      # chain anyway: a cache that "hits" in the log and saves nothing,
      # which is exactly the failure mode that looks identical to success
      # on a single run. Touch the restored trio forward, oldest
      # dependency first, only on an exact hit -- a bare touch on a miss
      # would create empty files in place of the real build inputs.
      - name: Advance restored model timestamps past their sources
        if: matrix.plat == 'manylinux_2_28_x86_64' && steps.bs-models.outputs.cache-hit == 'true'
        run: |
          touch tests/fixtures/es.hpp tests/fixtures/simp.hpp \
            tests/fixtures/newtrans.hpp tests/fixtures/conj.hpp
          touch tests/fixtures/es.o tests/fixtures/simp.o \
            tests/fixtures/newtrans.o tests/fixtures/conj.o
          touch tests/fixtures/es_model.so tests/fixtures/simp_model.so \
            tests/fixtures/newtrans_model.so tests/fixtures/conj_model.so

      - name: Conformance against reference BridgeStan
        if: matrix.plat == 'manylinux_2_28_x86_64'
        run: |
          # bridgestan downloads its own C++ sources from github the first
          # time a model is compiled, inside the first conformance run. A
          # 503 from that download surfaces as a conformance failure, which
          # reads as "the facade disagrees with the reference" when nothing
          # was ever compared -- main went red on exactly that. Fetch the
          # sources up front, where a flaky mirror gets a few tries and a
          # real outage says so in its own words. bridgestan retries the
          # download itself, but only a URLError: it calls every HTTPError
          # unrecoverable, and a 503 is an HTTPError.
          #
          # get_bridgestan_src() re-downloads and re-extracts unconditionally
          # -- it has no idea the cache step above may have just restored
          # the exact same tree -- so verify what it would unpack first,
          # the same way bridgestan's own compile_model() does, and only
          # call it when that verification fails. The retry loop still
          # wraps the real download: a cache miss (a bridgestan release, a
          # first run, a cold cache scope) still takes that path.
          for try in 1 2 3 4 5; do
            /tmp/wheeltest/bin/python <<'PY' && break
          import bridgestan.compile as c
          import bridgestan.download as d
          try:
              c.verify_bridgestan_path(str(d.CURRENT_BRIDGESTAN))
          except ValueError:
              d.get_bridgestan_src()
          PY
            echo "bridgestan source download failed (attempt $try of 5)"
            [ "$try" = 5 ] && exit 1
            sleep $((try * 20))
          done
          for m in es simp newtrans conj; do
            case $m in
              es) data=tests/fixtures/eight_schools.json ;;
              simp) data='{"K": 3}' ;;
              *) data=tests/fixtures/$m.json ;;
            esac
            /tmp/wheeltest/bin/python tools/bs_conformance.py \
              tests/fixtures/$m.stan --data "$data"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.plat }}
          path: dist/*.whl

      # The same _bin/ the wheel ships, packaged separately for the small R
      # bridge. Whatever build_wheel.sh put there rides along, so the Windows
      # tarball carries both compiler executables next to the DLL the way that
      # wheel does. Naming matches runtime_asset() in r/R/install.R -- os and
      # architecture as R spells them, normalized.
      - name: Runtime tarball
        env:
          # BSD tar otherwise writes an AppleDouble ._ entry beside every
          # file that carries an extended attribute, and untar() in R
          # would drop those into the user's cache directory.
          COPYFILE_DISABLE: '1'
        run: |
          mkdir -p runtime-dist
          tar czf "runtime-dist/stanli-runtime-${{ matrix.runtime }}.tar.gz" \
            -C python/stanli/_bin .
          tar tzf "runtime-dist/stanli-runtime-${{ matrix.runtime }}.tar.gz"
          ls -la runtime-dist/

      - uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.runtime }}
          path: runtime-dist/*.tar.gz

  # The R package tests, against a real runtime. They skip without
  # one, so this is the integration job where they actually run; r.yml has the
  # package but no library, and a green check there says nothing about whether
  # sampling works. Not in the
  # manylinux container -- that image has no R and installing one into
  # AlmaLinux costs more than running the .so on a normal runner, which
  # its glibc 2.28 floor makes safe.
  r-tests:
    name: R package against the runtime
    needs: [build, browser-compiler]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: runtime-linux-x86_64
          path: runtime

      - uses: actions/download-artifact@v4
        with:
          name: browser-compilers
          path: browser-compilers

      - name: The bundled R compiler is the exact shared artifact
        run: |
          source tools/stanc_embed/provenance.sh
          stanli_stancjs_artifact_matches \
            browser-compilers/stanli-compiler.js \
            "$STANC3_SRC_REPO" "$STANC3_SRC_SHA" stancjs
          cmp browser-compilers/stanli-compiler.js r/inst/js/stanc.js
          {
            cat browser-compilers/stanli-compiler.js.stamp
            sha=$(sha256sum browser-compilers/stanli-compiler.js | cut -d' ' -f1)
            echo "artifact_sha256=$sha"
          } > /tmp/r-stanc.js.src
          diff -u /tmp/r-stanc.js.src r/inst/js/stanc.js.src

      - name: Unpack the runtime
        run: |
          mkdir -p rt
          tar xzf runtime/*.tar.gz -C rt
          ls -la rt/
          echo "STANLI_RUNTIME=$PWD/rt/libstanli.so" >> "$GITHUB_ENV"

      - name: Fetch the previous release and the legacy anchor
        run: |
          mkdir -p previous-release/runtime legacy-release
          previous=https://github.com/seantalts/stanli/releases/download/v0.9.5
          legacy=https://github.com/seantalts/stanli/releases/download/v0.9.3
          curl -fsSL "$previous/stanli-runtime-linux-x86_64.tar.gz" \
            -o previous-release/runtime.tar.gz
          curl -fsSL "$previous/stanli_0.9.5.tar.gz" \
            -o previous-release/stanli_0.9.5.tar.gz
          curl -fsSL "$legacy/stanli_0.9.3.tar.gz" \
            -o legacy-release/stanli_0.9.3.tar.gz
          echo '6634d517be4a2938197f945cb2f86409f60c05045f512bd1f48a859a2e29cd21  previous-release/runtime.tar.gz' | sha256sum -c -
          echo '5a67cb58d57b1dd0b465858d07d0a40d21da1802644c93ead89369efd82892cb  previous-release/stanli_0.9.5.tar.gz' | sha256sum -c -
          echo '1acbe821c58115678a69451c553a9b23c141d009f53c142492cee94599430495  legacy-release/stanli_0.9.3.tar.gz' | sha256sum -c -
          tar xzf previous-release/runtime.tar.gz \
            -C previous-release/runtime
          test -f previous-release/runtime/libstanli.so

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # V8 and jsonlite exercise the compiler the R package actually ships.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          extra-packages: >-
            any::testthat, any::posterior, any::V8, any::jsonlite
          dependencies: '"hard"'

      # Through R CMD check rather than testthat directly, so the tests run
      # against the installed package in a clean temporary directory instead
      # of against the source tree.
      - name: Build and check
        working-directory: r
        env:
          _R_CHECK_FORCE_SUGGESTS_: 'false'
        run: |
          R CMD build .
          R CMD check --no-manual --ignore-vignettes stanli_*.tar.gz
          # A check whose tests all skipped is green and worthless, which
          # is the exact failure this job exists to prevent. The runtime
          # is right there, so nothing may skip for want of one.
          log=stanli.Rcheck/tests/testthat.Rout
          [ -f "$log" ] || log=stanli.Rcheck/tests/testthat.Rout.fail
          cat "$log"
          if grep -q 'no stanli runtime installed' "$log"; then
            echo "the sampling tests skipped: the runtime was not seen"
            exit 1
          fi

      - name: Bundled portable compiler through V8 and the current runtime
        working-directory: r
        run: |
          current_library="$PWD/../r-current-library"
          mkdir -p "$current_library"
          R CMD INSTALL --library="$current_library" stanli_*.tar.gz
          R_LIBS_USER="$current_library${R_LIBS_USER:+:$R_LIBS_USER}" \
            Rscript ../tests/test_r_portable_compiler.R

      - name: Both cross-release compiler and runtime directions
        working-directory: r
        run: |
          current_library="$PWD/../r-current-library"
          previous_library="$PWD/../r-v0.9.5-library"
          legacy_library="$PWD/../r-v0.9.3-library"
          previous_runtime="$PWD/../previous-release/runtime/libstanli.so"
          current_runtime="$STANLI_RUNTIME"

          STANLI_RUNTIME="$previous_runtime" \
            R_LIBS_USER="$current_library${R_LIBS_USER:+:$R_LIBS_USER}" \
            Rscript ../tests/test_r_portable_compiler.R

          mkdir -p "$previous_library"
          R CMD INSTALL --library="$previous_library" \
            ../previous-release/stanli_0.9.5.tar.gz
          STANLI_RUNTIME="$current_runtime" \
            R_LIBS_USER="$previous_library${R_LIBS_USER:+:$R_LIBS_USER}" \
            Rscript ../tests/test_r_portable_compiler.R

          mkdir -p "$legacy_library"
          R CMD INSTALL --library="$legacy_library" \
            ../legacy-release/stanli_0.9.3.tar.gz
          STANLI_RUNTIME="$current_runtime" \
            R_LIBS_USER="$legacy_library${R_LIBS_USER:+:$R_LIBS_USER}" \
            Rscript ../tests/test_r_legacy_compiler.R

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r-check-log
          path: r/stanli.Rcheck/

  # The Windows wheel cannot embed the native compiler yet. Cross-build both
  # the pristine stock rollback executable and stanli's portable-MIR executable
  # from the same source revision the other wheels embed, using stanc3's own
  # Linux-to-Windows recipe. Their provenance is checked before packaging.
  stanc-windows:
    name: cross-build Windows compilers
    needs: changes
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    env:
      WINDOWS_DUNE_VERSION: 3.24.2
    steps:
      - uses: actions/checkout@v4

      - name: Check the Windows compiler source pin
        run: |
          setup_repo=$(sed -n 's/^STANC3_SRC_REPO=\([^ ]*\).*/\1/p' \
                         tools/dev_setup.sh)
          setup_pin=$(sed -n 's/^STANC3_SRC_SHA=\([0-9a-f]*\).*/\1/p' \
                        tools/dev_setup.sh)
          test "$setup_repo" = "$STANC3_SRC_REPO"
          test "$setup_pin" = "$STANC3_SRC_SHA"

      # On a warm setup-ocaml cache this job still spent 73 seconds in setup
      # and 187 seconds cloning, installing 68 cross packages, and building.
      # Cache the complete 20 MB product instead. The key deliberately covers
      # every local input checked by the provenance stamp; the version prefix
      # owns the fixed Windows target, Dune context, profile, and subst recipe.
      - name: Restore the cross-built Windows compilers
        id: windows-compilers-cache
        uses: actions/cache@v4
        with:
          path: windows-compilers/
          key: >-
            windows-compilers-v1-${{ env.STANC3_SRC_REPO }}-${{ env.STANC3_SRC_SHA }}-ocaml${{ env.OCAML_VERSION }}-dune${{ env.WINDOWS_DUNE_VERSION }}-${{ hashFiles('.gitattributes', 'compiler/ocaml/**', 'compiler/js/**', 'tools/stanc_embed/**') }}

      - name: Cross-compiler
        if: steps.windows-compilers-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y file gcc-mingw-w64-x86-64 \
            gcc-mingw-w64-i686

      - name: OCaml ${{ env.OCAML_VERSION }} for Windows
        if: steps.windows-compilers-cache.outputs.cache-hit != 'true'
        uses: ocaml/setup-ocaml@v3
        with:
          cache-prefix: stanli-windows-${{ env.STANC3_SRC_SHA }}
          dune-cache: true
          ocaml-compiler: ocaml-windows64.${{ env.OCAML_VERSION }}
          opam-repositories: |
            windows: http://github.com/ocaml-cross/opam-cross-windows.git
            default: https://github.com/ocaml/opam-repository.git

      - name: Dune ${{ env.WINDOWS_DUNE_VERSION }}
        if: steps.windows-compilers-cache.outputs.cache-hit != 'true'
        run: opam install -y "dune.$WINDOWS_DUNE_VERSION"

      - name: Build the pinned compilers
        if: steps.windows-compilers-cache.outputs.cache-hit != 'true'
        run: |
          bash tests/test_windows_provenance.sh
          git clone "$STANC3_SRC_REPO" deps/stanc3-src
          git -C deps/stanc3-src checkout -q --detach "$STANC3_SRC_SHA"
          test "$(git -C deps/stanc3-src rev-parse HEAD)" = "$STANC3_SRC_SHA"
          (cd deps/stanc3-src &&
           bash -x scripts/install_build_deps_windows.sh &&
           opam exec -- dune subst &&
           opam exec -- dune build -x windows --profile release \
             src/stanc/stanc.exe)
          mkdir -p windows-compilers
          # Copy stock stanc before installing the stanli overlay. The overlay
          # corrects host-width-dependent int32 folding, so rebuilding stock
          # after it would silently destroy the pristine rollback artifact.
          cp deps/stanc3-src/_build/default.windows/src/stanc/stanc.exe \
             windows-compilers/stanc
          printf '%s\n' "$STANC3_SRC_SHA" > windows-compilers/stanc.src
          test "$(cat windows-compilers/stanc.src)" = "$STANC3_SRC_SHA"

          # This explicit target does not need js_of_ocaml for Windows. Avoid
          # the directory's default alias, which also names the JS executable.
          tools/stanc_embed/install_overlay.sh js deps/stanc3-src
          (cd deps/stanc3-src &&
           opam exec -- dune build -x windows --profile release \
             src/stanli_stancjs/stanli_compiler_cli.exe)
          cp deps/stanc3-src/_build/default.windows/src/stanli_stancjs/stanli_compiler_cli.exe \
             windows-compilers/stanli-compile

          source tools/stanc_embed/provenance.sh
          stanli_windows_cli_expected_stamp \
            "$STANC3_SRC_REPO" "$STANC3_SRC_SHA" \
            > windows-compilers/stanli-compile.stamp

      # Validate a restored product just as strictly as a newly built one.
      # On a cache hit there is no opam switch, so the helper checks every
      # source-derived field plus the configured OCaml version and target.
      - name: Validate the cross-built Windows compilers
        run: |
          test "$(cat windows-compilers/stanc.src)" = "$STANC3_SRC_SHA"
          source tools/stanc_embed/provenance.sh
          stanli_windows_cli_artifact_matches \
            windows-compilers/stanli-compile \
            "$STANC3_SRC_REPO" "$STANC3_SRC_SHA"
          test "$(_stanc_embed_stamp_value \
            windows-compilers/stanli-compile.stamp dune_version)" = \
            "$WINDOWS_DUNE_VERSION"
          compiler_types=$(file \
            windows-compilers/stanc windows-compilers/stanli-compile)
          printf '%s\n' "$compiler_types"
          test "$(printf '%s\n' "$compiler_types" | \
            grep -c 'PE32+ executable.*x86-64')" -eq 2
          if command -v x86_64-w64-mingw32-objdump >/dev/null 2>&1; then
            x86_64-w64-mingw32-objdump -f \
              windows-compilers/stanli-compile | \
              grep -E 'file format (pei|coff)-x86-64'
          else
            objdump -f windows-compilers/stanli-compile | \
              grep -E 'file format (pei|coff)-x86-64'
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: windows-compilers
          if-no-files-found: error
          path: windows-compilers/

  # Unlike the multi-hour C++ build below, the compiler cross-build is bounded
  # enough to gate pull requests. Run the PE executable on Windows and compare
  # it byte for byte with the same JS producer that the Linux-native check uses.
  windows-compiler:
    name: Windows compiler parity
    needs: [stanc-windows, browser-compiler]
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: windows-compilers
          path: windows-compilers

      - uses: actions/download-artifact@v4
        with:
          name: browser-compilers
          path: browser-compilers

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install the Windows parity test dependency
        shell: Rscript {0}
        run: install.packages("jsonlite")

      - name: Check provenance and portable bytes
        run: |
          while IFS= read -r input; do
            eol=$(git ls-files --eol -- "$input")
            printf '%s\n' "$eol"
            printf '%s\n' "$eol" | grep -Fq 'w/lf'
          done < <(
            source tools/stanc_embed/provenance.sh
            stanli_windows_cli_inputs
          )
          test "$(cat windows-compilers/stanc.src)" = "$STANC3_SRC_SHA"
          source tools/stanc_embed/provenance.sh
          stanli_windows_cli_artifact_matches \
            windows-compilers/stanli-compile \
            "$STANC3_SRC_REPO" "$STANC3_SRC_SHA"
          chmod +x windows-compilers/stanc windows-compilers/stanli-compile
          cp windows-compilers/stanc windows-compilers/stanc.exe
          ./windows-compilers/stanc.exe --version
          cp tests/compiler/portable_int32_overflow.stan \
            windows-compilers/stock-overflow.stan
          ./windows-compilers/stanc.exe --O1 --debug-optimized-mir \
            windows-compilers/stock-overflow.stan \
            > windows-compilers/stock-overflow.mir
          grep -Fq '2500000000' windows-compilers/stock-overflow.mir
          rm -f windows-compilers/stock-overflow.stan \
            windows-compilers/stock-overflow.hpp \
            windows-compilers/stock-overflow.mir
          # Node launches PE executables by their .exe name; the intermediate
          # artifact itself stays extensionless for build_wheel.sh, like stanc.
          cp windows-compilers/stanli-compile \
            windows-compilers/stanli-compile.exe
          node tests/test_portable_stancjs.cjs \
            browser-compilers/stanli-compiler.js \
            windows-compilers/stanli-compile.exe \
            browser-compilers/stancjs.bc.js
          Rscript tests/test_windows_compiler.R \
            windows-compilers/stanli-compile.exe \
            windows-compilers/stanc.exe

  # Everything except pull requests: main pushes, the nightly cron, and
  # release tags (the publish job needs this wheel, so a tag still waits
  # for it).
  windows:
    name: win_amd64
    if: github.event_name != 'pull_request'
    needs: [stanc-windows, windows-compiler]
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-ccache
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-pip
            mingw-w64-ucrt-x86_64-python-setuptools
            git
            unzip
            curl

      - name: Fingerprint the C++ compiler
        id: toolchain
        run: |
          fingerprint=$(c++ --version | sha256sum | cut -d' ' -f1)
          echo "id=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: >-
            ccache-win_amd64-ucrt64-release-v2-${{ steps.toolchain.outputs.id }}-${{ hashFiles('CMakeLists.txt', 'runtime/**', 'tests/**/*.cpp', 'tests/**/*.hpp', 'tools/**/*.cpp', 'tools/**/*.hpp', 'deps/fetch.sh') }}
          restore-keys: ccache-win_amd64-ucrt64-release-v2-${{ steps.toolchain.outputs.id }}-

      - name: Fetch pinned dependencies
        run: ./deps/fetch.sh

      - name: Install the source-built compilers
        uses: actions/download-artifact@v4
        with:
          name: windows-compilers
          path: deps/stanc3

      - name: Check compiler provenance
        run: |
          while IFS= read -r input; do
            eol=$(git ls-files --eol -- "$input")
            printf '%s\n' "$eol"
            printf '%s\n' "$eol" | grep -Fq 'w/lf'
          done < <(
            source tools/stanc_embed/provenance.sh
            stanli_windows_cli_inputs
          )
          test "$(cat deps/stanc3/stanc.src)" = "$STANC3_SRC_SHA"
          source tools/stanc_embed/provenance.sh
          stanli_windows_cli_artifact_matches \
            deps/stanc3/stanli-compile \
            "$STANC3_SRC_REPO" "$STANC3_SRC_SHA"
          chmod +x deps/stanc3/stanc deps/stanc3/stanli-compile
          cp deps/stanc3/stanc deps/stanc3/stanc.exe
          ./deps/stanc3/stanc.exe --version

      - name: Configure, build, test
        run: |
          export CCACHE_DIR="$PWD/.ccache" CCACHE_COMPRESS=1 CCACHE_MAXSIZE=600M
          ccache -z
          cmake -B build-rel -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build-rel -j4
          ccache -s
          ctest --test-dir build-rel --parallel 4 --output-on-failure

      - name: Build the wheel
        run: |
          python3 -m pip install --upgrade wheel
          ./tools/build_wheel.sh
          test -f python/stanli/_bin/stanli.dll
          test -f python/stanli/_bin/stanli-compile.exe
          test -f python/stanli/_bin/stanc.exe
          unzip -l dist/*.whl | grep -F 'stanli/_bin/stanli-compile.exe'
          unzip -l dist/*.whl | grep -F 'stanli/_bin/stanc.exe'

      # The wheel must work from python.org's CPython, not just msys2's:
      # that is the interpreter Windows users actually have.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the wheel and run the Python tests
        shell: pwsh
        run: |
          python -m venv wheeltest
          $whl = Get-Item dist\*.whl
          wheeltest\Scripts\pip install $whl.FullName
          wheeltest\Scripts\python tests\test_python.py

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-win_amd64
          path: dist/*.whl

      # As above, for the R package. This _bin/ has both compiler executables
      # as well as the DLL, because the Windows build does not embed one.
      - name: Runtime tarball
        run: |
          mkdir -p runtime-dist
          tar czf runtime-dist/stanli-runtime-windows-x86_64.tar.gz \
            -C python/stanli/_bin .
          members=$(tar tzf \
            runtime-dist/stanli-runtime-windows-x86_64.tar.gz)
          printf '%s\n' "$members"
          for file in stanli.dll stanli-compile.exe stanc.exe; do
            printf '%s\n' "$members" | grep -Eq "(^|/)${file}$"
          done
          test "$(printf '%s\n' "$members" | grep -vc '/$')" -eq 3

      - uses: actions/upload-artifact@v4
        with:
          name: runtime-windows-x86_64
          path: runtime-dist/*.tar.gz

  # The test suite with AddressSanitizer's shadow map on. Nothing else in
  # the repo builds with a sanitizer, and the memory bugs that reach this
  # project answer with WRONG NUMBERS rather than a crash: a GLM outcome
  # mapping `rows` integers out of a three-integer group returned -29.48
  # where the array form gives -16.22, with no diagnostic, and every test
  # and every corpus model stayed green. Rebuilt against the parent of
  # that fix, this configuration reports it on contact -- READ of size 4,
  # zero bytes after a 12-byte region, straight out of
  # poisson_log_glm_lpmf.
  #
  # Post-submit and scheduled only: a cold build runs close to the
  # 90-minute ceiling, too long to gate merges or releases on. The exact
  # release commit already ran this check when it landed on main, so version
  # tags do not repeat it. It runs ctest and nothing else -- no corpus check,
  # no conformance, no wheel -- because those are covered by jobs that are
  # not paying for instrumentation, and the 51 test binaries are the target.
  asan:
    name: ctest under AddressSanitizer
    if: >-
      github.event_name != 'pull_request' &&
      startsWith(github.ref, 'refs/tags/') == false
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
    # The first shipped configuration could not finish: gcc at
    # RelWithDebInfo (-O2 -g) with ASan took 8+ minutes per densities
    # shard -- 18% built after half an hour, runner reclaimed before the
    # end, and since the cache saved only on success, every subsequent
    # run started cold again. The ceiling exists so a stuck build fails
    # in bounded time instead of holding the concurrency queue.
    # Clang is selected below, but its memory profile is not measured yet;
    # retain these limits until a complete Clang run remeasures them.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install the Clang C/C++ compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
      - name: Fingerprint the Clang C++ compiler
        id: toolchain
        run: |
          fingerprint=$("$CXX" --version | sha256sum | cut -d' ' -f1)
          echo "id=$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Restore the compiler cache
        id: asan-cache
        uses: actions/cache/restore@v4
        with:
          # Its own key: these objects carry -fsanitize=address and must
          # never be handed to, or taken from, the wheel build's cache.
          path: .ccache
          key: >-
            ccache-asan-clang-o1-g1-v3-${{ steps.toolchain.outputs.id }}-${{ hashFiles('CMakeLists.txt', 'runtime/**', 'tests/**/*.cpp', 'tests/**/*.hpp', 'tools/**/*.cpp', 'tools/**/*.hpp', 'deps/fetch.sh') }}
          restore-keys: ccache-asan-clang-o1-g1-v3-${{ steps.toolchain.outputs.id }}-
      - name: Fetch pinned dependencies
        run: ./deps/fetch.sh
      # Both fatal runs of this job died at the same place -- the density
      # shards -- with "the runner has received a shutdown signal" while
      # the sibling manylinux job on its own runner sailed on. That is the
      # face an OOM-killed runner service wears: gcc's ASan instrumentation
      # multiplies compiler memory on exactly those TUs, and the 16 GB VM
      # has no swap at all. Swap converts the spike into slowness instead
      # of a dead runner; it is touched only if the spike happens.
      - name: Swap, so a compiler memory spike degrades instead of killing
        run: |
          # Not /swapfile: the runner image already runs ~4 GB of swap
          # there (fallocate on it says "Text file busy"), and the job
          # OOM'd straight through that allowance. And not on the root
          # disk: 8 GB of swap there is exactly the 8 GB the link step
          # later ran out of -- the debug-heavy ASan test binaries filled
          # the rest ("No space left on device" at 88%). /mnt is the
          # runner's ephemeral disk with room to spare. The before/after
          # prints are the capacity record; measured on this job, the
          # largest single compile peaks at 10.3 GB, so -j2 needs the
          # swap and the swap needs to be off the build's disk.
          swapon --show && free -h && df -h / /mnt
          sudo fallocate -l 8G /mnt/swapfile-asan
          sudo chmod 600 /mnt/swapfile-asan
          sudo mkswap /mnt/swapfile-asan
          sudo swapon /mnt/swapfile-asan
          swapon --show && free -h
      - name: Build with -fsanitize=address
        id: asan_build
        run: |
          which ccache || sudo apt-get install -y ccache
          export CCACHE_DIR="$PWD/.ccache" CCACHE_COMPRESS=1 CCACHE_MAXSIZE=600M
          export CCACHE_SLOPPINESS=pch_defines,time_macros,include_file_mtime,include_file_ctime
          ccache -z
          # -O1 -g1, and every number here was read off a failed run's
          # log rather than guessed. -O1: ASan's checks do not depend on
          # the optimizer, and gcc compiles the density shards several
          # times faster than at -O2. -g1, not -g: line tables are what
          # turn an ASan report into file:line, and they are ALL this job
          # needs -- at full -g the 52 test binaries each carry stan-math's
          # duplicated .debug_info and the build tree overran a disk that
          # started with 86 GB free ("No space left on device" at the
          # link, twice). -j2, not -j3: the largest single compile peaks
          # at 10.3 GB, so two of them need the swap on a 16 GB VM and
          # three of them killed the runner. None of this is shipped.
          # STANLI_SANITIZE adds the flags globally, so the vendored
          # SUNDIALS C is instrumented on the same terms as the kernels.
          cmake -B build-asan -DCMAKE_BUILD_TYPE=None \
            -DCMAKE_C_FLAGS="-O1 -g1" -DCMAKE_CXX_FLAGS="-O1 -g1" \
            -DSTANLI_SANITIZE=address \
            -DCMAKE_C_COMPILER="$CC" -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          # Peak of the largest single compile, the wheel build's own
          # instrumentation: GNU time reports the largest child, which is
          # exactly the number -j has to fit. This job has been OOM-killed
          # by guessed ceilings twice; from here the number is read off
          # the log. The same cache-hit caveat applies -- a warm build
          # compiles nothing and its peak is not a memory ceiling.
          # On failure, dump the capacity picture BEFORE exiting: five
          # attempts in, every theory so far died for want of exactly the
          # number a failed run did not print.
          /usr/bin/time -v cmake --build build-asan -j2 2>/tmp/build.err ||
            { cat /tmp/build.err
              df -h /; du -sh build-asan 2>/dev/null
              du -sh build-asan/* 2>/dev/null | sort -rh | head -15
              du -sh /mnt/swapfile-asan /home/runner/work 2>/dev/null
              exit 1; }
          kb=$(awk '/[Mm]aximum resident/ {print $NF}' /tmp/build.err)
          miss=$(ccache -s | awk '
            tolower($0) ~ /misses:|cache miss/ {
              for (i = 1; i <= NF; ++i)
                if ($i ~ /^[0-9]+$/) { print $i; exit }
            }')
          echo "ASan peak RSS $(( kb / 1024 )) MB on the largest single" \
               "compile, over ${miss:-?} ccache misses" \
               "$([ "${miss:-0}" -lt 20 ] && echo '(cached build:' \
               'this peak is not a memory ceiling)')"
          free -h && swapon --show && df -h / /mnt
          du -sh build-asan
          ccache -s
      # A completed compile owns the canonical immutable key. Saving an
      # interrupted cache there would freeze it as an exact hit forever.
      - name: Save the complete compiler cache
        if: >-
          always() &&
          steps.asan_build.outcome == 'success' &&
          steps.asan-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ${{ steps.asan-cache.outputs.cache-primary-key }}
      # Preserve partial progress under a unique fallback key. The next run
      # restores it through restore-keys and, once complete, promotes its
      # contents by saving the canonical key above.
      - name: Save partial compiler progress
        if: >-
          always() &&
          steps.asan_build.outcome == 'failure' &&
          steps.asan-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: >-
            ${{ steps.asan-cache.outputs.cache-primary-key }}-partial-${{ github.run_id }}-${{ github.run_attempt }}
      - name: ctest
        run: ctest --test-dir build-asan --output-on-failure
        env:
          # LeakSanitizer, which is a separate tool that ASan turns on by
          # default on Linux. What it would find is stan-math's autodiff
          # arena: it allocates blocks it deliberately never returns
          # (stack_alloc's free_all runs only from a static's destructor),
          # so every run would report it and nobody would read the rest.
          # Off wholesale rather than suppressed entry by entry, because
          # this job is here for overflows and use-after-free and a leak
          # is neither. macOS arm64 has no LSan to turn off, which is why
          # a local run needs nothing.
          ASAN_OPTIONS: detect_leaks=0

  # Pull requests compile the complete runtime for wasm32, catching portable
  # ABI and type-width failures without paying for the final Emscripten link.
  # Pushes and tags finish the module, run it, and publish the artifact used by
  # the Pages and release jobs below.
  wasm:
    name: wasm (browser build)
    needs: changes
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # actions-cache-folder is not just a download cache: it pins WHERE emsdk
      # lands. Without it the action installs to
      # /home/runner/work/_temp/<random-uuid>/emsdk-main, a different uuid
      # every run, and emcc bakes that path into the -isystem flags of every
      # compile -- so ccache hashes a different command line each run and
      # misses everything. Measured on this repo: the two Emscripten jobs sat
      # at 0/84 and 2/86 hits while the AddressSanitizer job, whose clang
      # lives at a stable /usr/bin path, hit 119/152.
      # actions-cache-folder only chooses WHERE setup-emsdk puts its downloads;
      # nothing persists that folder between runs on its own, so the action
      # re-downloaded every time and logged "No cached files found at path
      # .../emsdk-cache". This is the step that makes the input mean anything.
      # It does NOT pin the install path -- emsdk is still unpacked under
      # $RUNNER_TEMP/<uuid> -- which is what CCACHE_BASEDIR above is for.
      - name: Cache the emsdk download
        uses: actions/cache@v4
        with:
          path: emsdk-cache
          key: emsdk-${{ runner.os }}-${{ runner.arch }}-6.0.6-v1
      - uses: mymindstorm/setup-emsdk@v14
        with:
          actions-cache-folder: emsdk-cache
          version: 6.0.6
      - name: Fingerprint the Emscripten compiler
        id: toolchain
        run: |
          fingerprint=$(em++ --version | sha256sum | cut -d' ' -f1)
          echo "id=$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          # Keep this prefix disjoint from ccache-wasm-webr below. The old
          # `ccache-wasm-` restore prefix also matched the newer webR cache,
          # whose -fPIC objects cannot satisfy this browser build; after every
          # main run a PR therefore restored the wrong ~500 MB cache first.
          key: >-
            ccache-wasm-browser-emsdk6.0.6-v4-${{ steps.toolchain.outputs.id }}-${{ hashFiles('CMakeLists.txt', 'runtime/**', 'tests/tbb_stub.cpp', 'deps/fetch.sh') }}
          restore-keys: ccache-wasm-browser-emsdk6.0.6-v4-${{ steps.toolchain.outputs.id }}-
      - name: Fetch pinned dependencies
        run: ./deps/fetch.sh
      - name: Build stanli for WebAssembly
        run: |
          which ccache || sudo apt-get install -y ccache
          export CCACHE_DIR="$PWD/.ccache" CCACHE_COMPRESS=1 CCACHE_MAXSIZE=600M
          # /home/runner/work, NOT $GITHUB_WORKSPACE. setup-emsdk unpacks to
          # $RUNNER_TEMP (/home/runner/work/_temp/<uuid>/emsdk-main), which is a
          # SIBLING of the workspace, not inside it -- so a basedir of the
          # workspace leaves exactly the paths that vary untouched. Measured:
          # with the workspace as basedir the hit rate stayed at 1/84.
          export CCACHE_BASEDIR="$(dirname "$RUNNER_TEMP")"
          ccache -z
          emcmake cmake -B build-wasm -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            cmake --build build-wasm -j4 --target stanli
          else
            cmake --build build-wasm -j4
          fi
          ccache -s
      - name: Sample eight schools under Node
        if: github.event_name != 'pull_request'
        run: node tests/test_wasm.cjs
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: wasm
          path: |
            build-wasm/stanli.js
            build-wasm/stanli.wasm

  # The webR runtime: libstanli.so as an Emscripten side module, the
  # artifact stanli_install() downloads on emscripten-wasm32 (webR under
  # r-universe). The emsdk here is pinned to the version the CURRENT webR
  # release builds with, NOT the browser build's pin: side modules are
  # not binary compatible across webR's Emscripten bumps, so when webR
  # updates Emscripten this pin must follow and a release must be cut, or
  # users on the new webR load an incompatible artifact and dyn.load
  # fails. webR 0.6.0 = Emscripten 4.0.8; the npm webr pinned below is
  # the same release, so the load test answers the exact ABI question.
  wasm-webr:
    name: webR runtime
    if: github.event_name != 'pull_request'
    needs: browser-compiler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: browser-compilers
          path: browser-compilers
      # actions-cache-folder is not just a download cache: it pins WHERE emsdk
      # lands. Without it the action installs to
      # /home/runner/work/_temp/<random-uuid>/emsdk-main, a different uuid
      # every run, and emcc bakes that path into the -isystem flags of every
      # compile -- so ccache hashes a different command line each run and
      # misses everything. Measured on this repo: the two Emscripten jobs sat
      # at 0/84 and 2/86 hits while the AddressSanitizer job, whose clang
      # lives at a stable /usr/bin path, hit 119/152.
      # actions-cache-folder only chooses WHERE setup-emsdk puts its downloads;
      # nothing persists that folder between runs on its own, so the action
      # re-downloaded every time and logged "No cached files found at path
      # .../emsdk-cache". This is the step that makes the input mean anything.
      # It does NOT pin the install path -- emsdk is still unpacked under
      # $RUNNER_TEMP/<uuid> -- which is what CCACHE_BASEDIR above is for.
      - name: Cache the emsdk download
        uses: actions/cache@v4
        with:
          path: emsdk-cache
          key: emsdk-${{ runner.os }}-${{ runner.arch }}-4.0.8-v1
      - uses: mymindstorm/setup-emsdk@v14
        with:
          actions-cache-folder: emsdk-cache
          version: 4.0.8
      - name: Fingerprint the Emscripten compiler
        id: toolchain
        run: |
          fingerprint=$(em++ --version | sha256sum | cut -d' ' -f1)
          echo "id=$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: >-
            ccache-wasm-webr-emsdk4.0.8-side-v4-${{ steps.toolchain.outputs.id }}-${{ hashFiles('CMakeLists.txt', 'runtime/**', 'tests/tbb_stub.cpp', 'deps/fetch.sh') }}
          restore-keys: ccache-wasm-webr-emsdk4.0.8-side-v4-${{ steps.toolchain.outputs.id }}-
      - name: Fetch pinned dependencies
        run: ./deps/fetch.sh
      - name: Build the side module
        run: |
          which ccache || sudo apt-get install -y ccache
          export CCACHE_DIR="$PWD/.ccache" CCACHE_COMPRESS=1 CCACHE_MAXSIZE=600M
          # /home/runner/work, NOT $GITHUB_WORKSPACE. setup-emsdk unpacks to
          # $RUNNER_TEMP (/home/runner/work/_temp/<uuid>/emsdk-main), which is a
          # SIBLING of the workspace, not inside it -- so a basedir of the
          # workspace leaves exactly the paths that vary untouched. Measured:
          # with the workspace as basedir the hit rate stayed at 1/84.
          export CCACHE_BASEDIR="$(dirname "$RUNNER_TEMP")"
          ccache -z
          emcmake cmake -B build-wasm-side -DCMAKE_BUILD_TYPE=Release \
            -DSTANLI_WASM_SIDE=ON -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build-wasm-side -j4 --target stanli_webr
          ccache -s
      - name: Load it into webR
        run: |
          npm install webr@0.6.0
          cmp browser-compilers/stanli-compiler.js r/inst/js/stanc.js
          node tests/test_webr.mjs build-wasm-side/libstanli.so \
            r/inst/js/stanc.js

      # Not a gate: webR releases on its own schedule. The module loads
      # across Emscripten majors (measured both directions on 4.0.8 and
      # 5.0.7), so this failing means a webR release finally broke the
      # dylink ABI -- caught here, that is a pin bump and a release cut
      # before any user sees it.
      - name: Load it into the newest released webR
        run: |
          npm install webr@latest
          ver=$(python3 -c \
            'import json; print(json.load(open("node_modules/webr/package.json"))["version"])')
          if node tests/test_webr.mjs build-wasm-side/libstanli.so; then
            echo "canary: loads in webr@$ver"
          else
            echo "::warning title=webR canary::the side module does not load in webr@$ver; bump the emsdk pin and cut a release"
          fi
      - name: Runtime tarball
        run: |
          mkdir -p runtime-dist
          tar czf runtime-dist/stanli-runtime-emscripten-wasm32.tar.gz \
            -C build-wasm-side libstanli.so
          tar tzf runtime-dist/stanli-runtime-emscripten-wasm32.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-emscripten-wasm32
          path: runtime-dist/*.tar.gz

  # One exact-source compiler build shared by pull-request parity, Pages, and
  # npm. The stanli producer and its native CLI compile the same OCaml modules;
  # stock stancjs is retained in the artifact as the legacy rollback path.
  browser-compiler:
    name: portable browser compiler
    needs: changes
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore browser compilers
        id: stancjs-cache
        uses: actions/cache@v4
        with:
          path: |
            deps/stanc3/stancjs.bc.js
            deps/stanc3/stancjs.bc.js.stamp
            deps/stanc3/stanli-compiler.js
            deps/stanc3/stanli-compiler.js.stamp
            deps/stanc3/stanli_compiler_cli
            deps/stanc3/stanli_compiler_cli.stamp
          key: >-
            browser-compilers-v2-${{ env.STANC3_SRC_SHA }}-ocaml${{ env.OCAML_VERSION }}-jsoo6.4.1-${{ hashFiles('compiler/ocaml/**', 'compiler/js/**', 'tools/stanc_embed/**') }}

      - name: opam ${{ env.OPAM_VERSION }}
        if: steps.stancjs-cache.outputs.cache-hit != 'true'
        run: |
          url=https://github.com/ocaml/opam/releases/download
          curl -fsSL -o /tmp/opam \
            "$url/$OPAM_VERSION/opam-$OPAM_VERSION-x86_64-linux"
          sudo install -m 755 /tmp/opam /usr/local/bin/opam
          opam init --bare --disable-sandboxing --no-setup -y
        env:
          OPAMYES: '1'

      - name: Build browser compilers
        if: steps.stancjs-cache.outputs.cache-hit != 'true'
        run: |
          opam switch create stancjs "ocaml-base-compiler.$OCAML_VERSION" -y
          setup_repo=$(sed -n 's/^STANC3_SRC_REPO=\([^ ]*\).*/\1/p' \
                         tools/dev_setup.sh)
          setup_pin=$(sed -n 's/^STANC3_SRC_SHA=\([0-9a-f]*\).*/\1/p' \
                        tools/dev_setup.sh)
          test "$setup_repo" = "$STANC3_SRC_REPO"
          test "$setup_pin" = "$STANC3_SRC_SHA"
          git clone "$STANC3_SRC_REPO" deps/stanc3-src
          git -C deps/stanc3-src checkout -q --detach "$STANC3_SRC_SHA"
          test "$(git -C deps/stanc3-src rev-parse HEAD)" = "$STANC3_SRC_SHA"
          (cd deps/stanc3-src &&
           opam install . --switch=stancjs --deps-only -y &&
           opam install --switch=stancjs -y \
             js_of_ocaml.6.4.1 js_of_ocaml-compiler.6.4.1 \
             js_of_ocaml-ppx.6.4.1 &&
           eval "$(opam env --switch=stancjs)" &&
           dune subst &&
           dune build --profile release src/stancjs/stancjs.bc.js)
          mkdir -p deps/stanc3
          cp deps/stanc3-src/_build/default/src/stancjs/stancjs.bc.js \
            deps/stanc3/
          tools/stanc_embed/install_overlay.sh js deps/stanc3-src
          (cd deps/stanc3-src &&
           eval "$(opam env --switch=stancjs)" &&
           dune build --profile release \
             src/stanli_stancjs/stanli_stancjs.bc.js \
             src/stanli_stancjs/stanli_compiler_cli.exe)
          cp deps/stanc3-src/_build/default/src/stanli_stancjs/stanli_stancjs.bc.js \
            deps/stanc3/stanli-compiler.js
          cp deps/stanc3-src/_build/default/src/stanli_stancjs/stanli_compiler_cli.exe \
            deps/stanc3/stanli_compiler_cli
          chmod +x deps/stanc3/stanli_compiler_cli
          source tools/stanc_embed/provenance.sh
          stancjs_expected_stamp "$STANC3_SRC_REPO" "$STANC3_SRC_SHA" \
            stancjs > deps/stanc3/stancjs.bc.js.stamp
          stanli_stancjs_expected_stamp "$STANC3_SRC_REPO" "$STANC3_SRC_SHA" \
            stancjs > deps/stanc3/stanli-compiler.js.stamp
          cp deps/stanc3/stanli-compiler.js.stamp \
            deps/stanc3/stanli_compiler_cli.stamp
        env:
          OPAMYES: '1'

      - name: Validate browser compiler provenance
        run: |
          source tools/stanc_embed/provenance.sh
          stancjs_artifact_matches deps/stanc3/stancjs.bc.js \
            "$STANC3_SRC_REPO" "$STANC3_SRC_SHA" stancjs
          stanli_stancjs_artifact_matches deps/stanc3/stanli-compiler.js \
            "$STANC3_SRC_REPO" "$STANC3_SRC_SHA" stancjs
          stanli_stancjs_artifact_matches deps/stanc3/stanli_compiler_cli \
            "$STANC3_SRC_REPO" "$STANC3_SRC_SHA" stancjs
          cat deps/stanc3/stancjs.bc.js.stamp
          cat deps/stanc3/stanli-compiler.js.stamp

      - name: Native and JavaScript compilers emit identical bytes
        run: |
          {
            node tests/test_portable_stancjs.cjs \
              deps/stanc3/stanli-compiler.js \
              deps/stanc3/stanli_compiler_cli \
              deps/stanc3/stancjs.bc.js
            node tests/test_worker_compiler.cjs custom js/worker.js \
              deps/stanc3/stanli-compiler.js deps/stanc3/stancjs.bc.js
            node tests/test_worker_compiler.cjs fallback js/worker.js \
              deps/stanc3/stanli-compiler.js deps/stanc3/stancjs.bc.js
            wc -c deps/stanc3/stanli-compiler.js deps/stanc3/stancjs.bc.js
            gzip -c deps/stanc3/stanli-compiler.js | wc -c
            gzip -c deps/stanc3/stancjs.bc.js | wc -c
          } 2>&1 | tee /tmp/portable-mir-browser-measurements.txt

      - name: Stage browser compilers
        run: |
          mkdir -p browser-dist
          cp deps/stanc3/stanli-compiler.js \
            deps/stanc3/stanli-compiler.js.stamp \
            deps/stanc3/stancjs.bc.js \
            deps/stanc3/stancjs.bc.js.stamp browser-dist/

      - uses: actions/upload-artifact@v4
        with:
          name: browser-compilers
          path: browser-dist/

      - uses: actions/upload-artifact@v4
        with:
          name: browser-compiler-measurements
          path: /tmp/portable-mir-browser-measurements.txt

  # Branch protection requires this exact check name. It follows the heavy
  # manylinux build for source PRs and succeeds after the static checks for a
  # docs-only PR; a failed or unexpectedly skipped heavy build still fails.
  pr-gate:
    name: manylinux_2_28_x86_64
    if: always() && github.event_name == 'pull_request'
    needs: [changes, static_checks, build]
    runs-on: ubuntu-latest
    steps:
      - name: Verify the required validation path
        env:
          CHANGE_RESULT: ${{ needs.changes.result }}
          STATIC_RESULT: ${{ needs.static_checks.result }}
          HEAVY: ${{ needs.changes.outputs.heavy }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          test "$CHANGE_RESULT" = success
          test "$STATIC_RESULT" = success
          if [ "$HEAVY" = true ]; then
            test "$BUILD_RESULT" = success
          else
            test "$HEAVY" = false
            test "$BUILD_RESULT" = skipped
          fi

  # The public demo: web/ plus the runtime and compiler artifacts, deployed
  # to GitHub Pages on every main push. The stanli compiler emits portable
  # MIR; stock stancjs remains beside it as the legacy rollback path.
  pages:
    name: deploy the browser demo
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [static_checks, wasm, browser-compiler]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: wasm
          path: web/

      - uses: actions/download-artifact@v4
        with:
          name: browser-compilers
          path: web/

      # The demo page offers every posteriordb model stanli has verified,
      # so the deploy needs the corpus that tools/gen_web_models.py copies
      # into web/models/. Same sparse checkout and cache as the build job.
      - name: Restore posteriordb (models and data only)
        id: pdb-cache
        uses: actions/cache@v4
        with:
          path: deps/posteriordb
          key: pdb-lite-${{ env.PDB_SHA }}-2
      - name: Fetch posteriordb
        if: steps.pdb-cache.outputs.cache-hit != 'true'
        run: |
          git clone --filter=blob:none --sparse \
            https://github.com/stan-dev/posteriordb.git deps/posteriordb
          git -C deps/posteriordb sparse-checkout set \
            posterior_database/models/stan posterior_database/data/data \
            posterior_database/posteriors
          git -C deps/posteriordb fetch -q origin "$PDB_SHA"
          git -C deps/posteriordb checkout -q "$PDB_SHA"
      - name: Model catalog
        run: python3 tools/gen_web_models.py

      - name: Compile and sample through the browser compiler
        run: |
          node tests/test_wasm.cjs web/stanli.js \
            web/stanli-compiler.js web/stancjs.bc.js

      - name: Assemble the page and the npm package
        run: |
          cp web/stanli.js web/stanli.wasm web/stanli-compiler.js \
            web/stancjs.bc.js js/
          cp js/index.mjs web/stanli.mjs
          cp js/worker.js web/
          (cd js && npm pack --pack-destination ..)

      - uses: actions/upload-artifact@v4
        with:
          # Scoped, so npm pack writes seantalts-stanli-<version>.tgz.
          name: npm-package
          path: "*stanli-*.tgz"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/

      - id: deployment
        uses: actions/deploy-pages@v4

  # npm, tag-gated like PyPI. A release tag v* publishes every channel
  # at once (PyPI, the runtime release, npm); versions move in lockstep,
  # and both publish jobs assert their manifest agrees with the tag.
  # npm-v* remains as an npm-only republish hatch for when npm alone
  # fails on a release that already went out everywhere else. Publishing
  # goes through npm trusted publishing (OIDC, no token in secrets), and
  # the artifacts are the same ones the wasm and browser-compiler jobs
  # produced for this exact commit.
  npm-publish:
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      startsWith(github.ref, 'refs/tags/npm-v')
    needs: [static_checks, wasm, browser-compiler]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write  # npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: wasm
          path: npm-dist/

      - uses: actions/download-artifact@v4
        with:
          name: browser-compilers
          path: npm-dist/

      - name: Tag matches the packaged version
        run: |
          tag="${GITHUB_REF_NAME#npm-}"
          tag="${tag#v}"
          pkg=$(python3 -c "import json; print(json.load(open('js/package.json'))['version'])")
          echo "tag $tag, package.json $pkg"
          [ "$tag" = "$pkg" ]

      - name: Compile and sample through the packaged browser compiler
        run: |
          node tests/test_wasm.cjs npm-dist/stanli.js \
            npm-dist/stanli-compiler.js npm-dist/stancjs.bc.js

      - name: Assemble the npm package
        run: |
          cp npm-dist/stanli.js npm-dist/stanli.wasm \
            npm-dist/stanli-compiler.js npm-dist/stancjs.bc.js js/

      # Deliberately no registry-url: setup-node writes an .npmrc with a
      # placeholder _authToken when it is given one, npm sees credentials
      # and never attempts the OIDC exchange, and the registry answers a
      # write it cannot authorize with 404 rather than 401. That is what
      # npm-v0.5.1 died of. Trusted publishing wants no token at all.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Trusted publishing landed in npm 11.5.1; whatever Node ships is
      # not a promise about that.
      - name: npm new enough to exchange the OIDC token
        run: |
          npm install -g npm@latest
          npm --version

      - name: Publish
        run: |
          ls -la js/
          cd js && npm publish

  # The R package's runtime distribution channel. The small R bridge is built
  # by the package repository; the runtime it dlopens comes from here, the same
  # split torch uses for libtorch. This job is what makes stanli_install()
  # resolve to anything at all.
  #
  # Tag-gated with the same reasoning as PyPI, and it uploads the R source
  # tarball too, so GitHub installs and the release record use the same package
  # source R-universe follows.
  runtime-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [static_checks, build, windows, wasm-webr]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release and attach assets to it
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: runtime
          pattern: runtime-*
          merge-multiple: true

      # The R package pins the release it was built against rather than
      # tracking "latest", so the two have to be bumped together. Caught
      # here, that is a failed tag build; missed, it is every user's
      # stanli_install() downloading a 404 until someone cuts another
      # release.
      - name: The R package pins this release
        run: |
          pin=$(sed -n 's/^stanli_runtime_release <- "\(.*\)"$/\1/p' \
                r/R/install.R)
          echo "tag $GITHUB_REF_NAME, r/R/install.R pins ${pin:-<none>}"
          [ "$pin" = "$GITHUB_REF_NAME" ]

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: The R source tarball
        run: R CMD build r

      - name: Attach the assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la runtime/
          # Six platforms, one asset each. A partial upload is worse
          # than none: releases/latest/download resolves for five
          # platforms and 404s for the sixth, and nothing says which.
          n=$(ls runtime/*.tar.gz | wc -l)
          echo "$n runtime assets"
          [ "$n" -eq 6 ]
          # Immutable releases freeze their assets the moment they are
          # published, so everything must attach while the release is a
          # draft and publishing is the last step. Publishing first and
          # uploading after is a 422; worse, deleting the failed release
          # tombstones the tag name forever (v0.5.0 is such a casualty).
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --draft \
              --title "stanli ${GITHUB_REF_NAME#v}" --generate-notes
          gh release upload "$GITHUB_REF_NAME" \
            runtime/*.tar.gz stanli_*.tar.gz --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false

  publish:
    # Tags only. PyPI versions can never be reused, so this must not fire
    # on a branch push.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [static_checks, build, windows]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read   # naming any permission zeroes the rest, so restate it
      id-token: write  # PyPI trusted publishing; no API token in secrets
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheel-*
          merge-multiple: true

      # PyPI silently falls back to plain text if the description fails to
      # render, and the version is permanent once uploaded. Check before,
      # not after.
      - name: The project page renders
        run: |
          python3 -m pip install --upgrade twine
          twine check --strict dist/*.whl
          ls -la dist/

      # stanli/__init__.py holds the version; the tag has to agree with it,
      # or a mistyped tag silently publishes the wrong number. The npm
      # package rides the same tag now, so js/package.json has to agree
      # too, or the release goes out with the channels disagreeing.
      - name: Tag matches the packaged version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python3 - <<'PY'
          import pathlib, re
          src = pathlib.Path('python/stanli/__init__.py').read_text()
          print(re.search(r'^__version__ = "([^"]+)"', src, re.M).group(1))
          PY
          )
          npmpkg=$(python3 -c "import json; print(json.load(open('js/package.json'))['version'])")
          echo "tag $tag, package $pkg, package.json $npmpkg"
          [ "$tag" = "$pkg" ]
          [ "$tag" = "$npmpkg" ]
          ls dist/ | grep -q "stanli-$pkg-py3-none-" ||
            { echo "no wheel named for version $pkg"; exit 1; }

      - uses: pypa/gh-action-pypi-publish@release/v1

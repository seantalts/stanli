name: Stan conformance nightly

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Must match tools/dev_setup.sh and wheels.yml; only used when the
  # toolchain cache misses and the pinned stanc is rebuilt from source.
  OPAM_VERSION: 2.5.2

concurrency:
  group: stan-conformance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # What has the Stan language grown that the pinned toolchain cannot
  # see? stanc3 checks its full signature dump into its own repository,
  # so this is a text diff between our pin and upstream master: nothing
  # is downloaded but two files, and no unreviewed compiler runs. Its
  # own job, so a toolchain-build failure cannot hide the report.
  # Reporting only: a frozen toolchain cannot *test* a new signature --
  # that is a reviewed pin advance (STANC3_SRC_SHA in dev_setup.sh).
  signature-watch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Diff pinned signatures against upstream master
        run: ./harnesses/conformance/signature_watch.sh

  inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # dev_setup.sh is in the key: the stanc pin (STANC3_SRC_SHA)
      # lives there, so advancing it rolls this cache.
      - name: Restore pinned Stan and CmdStan sources
        uses: actions/cache@v4
        with:
          path: |
            deps/math
            deps/stan
            deps/stanc3
            deps/cmdstan
            deps/bridgestan
          key: conformance-deps-linux-x86_64-${{ hashFiles('deps/fetch.sh', 'harnesses/conformance/fetch_cmdstan.sh', 'harnesses/conformance/build_stanc.sh', 'tools/dev_setup.sh') }}

      # Only exercised when the cache misses: fetch_cmdstan.sh builds
      # the pinned stanc from source then, and the build needs opam.
      # Same pinned opam release the wheels use.
      - name: opam (for a cold stanc build)
        run: |
          url=https://github.com/ocaml/opam/releases/download
          curl -fsSL --retry 5 -o /tmp/opam \
            "$url/$OPAM_VERSION/opam-$OPAM_VERSION-x86_64-linux"
          chmod +x /tmp/opam
          sudo install -m 755 /tmp/opam /usr/local/bin/opam
          # Runner images lack bubblewrap; same flag the wheels use.
          opam init --bare --disable-sandboxing --no-setup -y

      - name: Validate the complete pinned reference toolchain
        run: |
          ./deps/fetch.sh
          ./harnesses/conformance/fetch_cmdstan.sh

      - name: Build the public stanli Python runtime
        run: |
          cmake -B build-rel -DCMAKE_BUILD_TYPE=Release
          cmake --build build-rel --target stanli_shared -j2
          mkdir -p python/stanli/_bin
          cp build-rel/libstanli.so python/stanli/_bin/
          cp deps/stanc3/stanc-pinned python/stanli/_bin/stanc

      - name: Emit the deterministic partition manifest
        run: |
          python3 harnesses/stan_conformance.py \
            --stanc deps/stanc3/stanc-pinned \
            --cmdstan deps/cmdstan \
            --write-manifest 8 \
            --output conformance-manifest

      - uses: actions/upload-artifact@v4
        with:
          name: conformance-manifest
          path: conformance-manifest/partition-manifest.json

      - uses: actions/upload-artifact@v4
        with:
          name: conformance-runtime-linux-x86_64
          path: python/stanli/_bin/

  partition:
    needs: inventory
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4

      # Identical key to the inventory job, so this restores what that
      # job built and saved -- including the source-built stanc, whose
      # provenance file makes the revalidation below a no-op.
      - name: Restore pinned Stan and CmdStan sources
        uses: actions/cache@v4
        with:
          path: |
            deps/math
            deps/stan
            deps/stanc3
            deps/cmdstan
            deps/bridgestan
          key: conformance-deps-linux-x86_64-${{ hashFiles('deps/fetch.sh', 'harnesses/conformance/fetch_cmdstan.sh', 'harnesses/conformance/build_stanc.sh', 'tools/dev_setup.sh') }}

      # Insurance for the cache evaporating between inventory and here:
      # revalidation would then rebuild stanc from source, which needs
      # opam. On the ordinary path this binary is installed and unused.
      - name: opam (for a cold stanc build)
        run: |
          url=https://github.com/ocaml/opam/releases/download
          curl -fsSL --retry 5 -o /tmp/opam \
            "$url/$OPAM_VERSION/opam-$OPAM_VERSION-x86_64-linux"
          chmod +x /tmp/opam
          sudo install -m 755 /tmp/opam /usr/local/bin/opam
          # Runner images lack bubblewrap; same flag the wheels use.
          opam init --bare --disable-sandboxing --no-setup -y

      - name: Revalidate restored reference inputs
        run: |
          ./deps/fetch.sh
          ./harnesses/conformance/fetch_cmdstan.sh

      - uses: actions/download-artifact@v4
        with:
          name: conformance-runtime-linux-x86_64
          path: python/stanli/_bin

      - name: Restore executable mode stripped by artifact transport
        run: chmod +x python/stanli/_bin/stanc

      - name: Install the conformance runtime
        run: |
          python3 -m venv "$RUNNER_TEMP/stanli-conformance-venv"
          "$RUNNER_TEMP/stanli-conformance-venv/bin/pip" install \
            --disable-pip-version-check \
            -r harnesses/conformance/requirements.txt

      - name: Restore content-addressed reference shards
        uses: actions/cache@v4
        with:
          path: conformance-cache
          key: conformance-reference-linux-x86_64-${{ matrix.partition }}-${{ github.sha }}
          restore-keys: |
            conformance-reference-linux-x86_64-${{ matrix.partition }}-

      - name: Run differential partition ${{ matrix.partition }}/8
        id: conformance
        continue-on-error: true
        run: |
          python3 harnesses/stan_conformance.py \
            --stanc deps/stanc3/stanc-pinned \
            --cmdstan deps/cmdstan \
            --build build-rel \
            --shard ${{ matrix.partition }}/8 \
            --jobs 2 \
            --resume conformance-cache \
            --stanli-python "$RUNNER_TEMP/stanli-conformance-venv/bin/python" \
            --stanli-pythonpath python \
            --failure-limit 20 \
            --output conformance-part-${{ matrix.partition }}

      - name: Upload partition report and reproducers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-part-${{ matrix.partition }}
          if-no-files-found: error
          path: |
            conformance-part-${{ matrix.partition }}/
            !conformance-part-${{ matrix.partition }}/cache/

  aggregate:
    needs: [inventory, partition]
    if: always() && needs.inventory.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: conformance-manifest
          path: conformance-manifest

      - uses: actions/download-artifact@v4
        with:
          pattern: conformance-part-*
          path: conformance-parts

      # --baseline is the ratchet. The gate stopped failing on coverage
      # gaps, which is right -- a runtime being built out has them by
      # definition -- but that left nothing watching for coverage going
      # BACKWARDS: a lowering regression that turns a verified function
      # into a compile refusal lands in unexpected_unsupported, which no
      # longer blocks, and a green run would not mention it.
      #
      # The comparison is directional. Wiring a function up changes its
      # classification and does not fail the run; losing one that used to
      # match CmdStan does, as does a case vanishing from the inventory or
      # the pinned stanc or policy moving under the baseline.
      #
      # Advancing it is a reviewed act: re-run with --update-snapshot and
      # commit docs/conformance-baseline.json.gz in the same PR as the work
      # that earned it.
      - name: Reject missing or duplicate rows and render the aggregate
        id: aggregate
        continue-on-error: true
        run: |
          python3 harnesses/stan_conformance.py \
            --aggregate conformance-parts/*/conformance.json \
            --manifest conformance-manifest/partition-manifest.json \
            --baseline docs/conformance-baseline.json.gz \
            --output conformance-aggregate \
            --failure-limit 40

      - name: Upload aggregate report and reproducers
        id: aggregate_artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-aggregate
          if-no-files-found: error
          path: conformance-aggregate/

      - name: Write the Actions summary
        if: always() && hashFiles('conformance-aggregate/conformance.json') != ''
        env:
          ARTIFACT_URL: ${{ steps.aggregate_artifact.outputs.artifact-url }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import html
          import json
          import os

          report = json.load(open("conformance-aggregate/conformance.json"))
          artifact_url = os.environ.get("ARTIFACT_URL", "")
          missing_statuses = {"generator_gap", "unexpected_unsupported"}
          blocking_statuses = {
              "generator_gap", "harness_error", "mismatch",
              "unexpected_unsupported",
          }

          def cell(value, limit=None):
              text = " ".join(str(value or "").split())
              if limit is not None and len(text) > limit:
                  text = text[:limit - 1] + "…"
              return html.escape(text).replace("|", "&#124;")

          def findings_table(rows, limit):
              shown = rows[:limit]
              print(f"Showing {len(shown)} of {len(rows)} findings.")
              print()
              print("| Status | Case ID | Reason | Reproduce |")
              print("| --- | --- | --- | --- |")
              for row in shown:
                  command = row.get("repro_command") or ""
                  print(
                      f"| `{cell(row['status'])}` "
                      f"| <code>{cell(row['case_id'])}</code> "
                      f"| {cell(row['reason'], 240)} "
                      f"| <code>{cell(command, 240)}</code> |"
                  )

          print("# Generated Stan conformance")
          print()
          gate = "GREEN" if report["green"] else "RED"
          if artifact_url:
              print(f"**Gate:** {gate} · "
                    f"[Download the complete report, unsupported list, "
                    f"and reproducers]({artifact_url})")
          else:
              print(f"**Gate:** {gate}")
          print()
          print("| Status | Count |")
          print("| --- | ---: |")
          for status, count in report["status_counts"].items():
              print(f"| `{status}` | {count} |")
          print()
          print("Gate issues:", ", ".join(report["gate_issues"]) or "none")

          missing = [
              row for row in report["results"]
              if row["kind"] == "signature"
              and row["status"] in missing_statuses
          ]
          missing.sort(key=lambda row: (
              0 if row["status"] == "unexpected_unsupported" else 1,
              row["case_id"],
          ))
          print()
          print("## Missing signature coverage")
          print()
          if missing:
              findings_table(missing, 40)
          else:
              print("No generated or runtime support gaps were found.")

          missing_ids = {row["case_id"] for row in missing}
          other_blocking = [
              row for row in report["results"]
              if row["status"] in blocking_statuses
              and row["case_id"] not in missing_ids
          ]
          other_priority = {
              "harness_error": 0, "mismatch": 1,
              "unexpected_unsupported": 2, "generator_gap": 3,
          }
          other_blocking.sort(key=lambda row: (
              other_priority[row["status"]], row["case_id"],
          ))
          print()
          print("## Other blocking findings")
          print()
          if other_blocking:
              findings_table(other_blocking, 20)
          else:
              print("No mismatches, construct gaps, or infrastructure "
                    "errors were found.")
          PY

      - name: Enforce the aggregate gate
        if: always()
        run: test '${{ steps.aggregate.outcome }}' = success

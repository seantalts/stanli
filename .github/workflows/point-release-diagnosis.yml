# Temporary bounded oracle diagnosis; no publisher or benchmark timing.
name: Point release Intel numerical diagnosis
on:
  push:
    branches: ['codex/point-release-*']
    paths:
      - '.github/workflows/point-release-diagnosis.yml'
      - 'tools/point_release_diagnosis.py'
      - 'runtime/**'
      - 'compiler/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  intel-oracle:
    runs-on: macos-15-intel
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: '10.15'
      STANC3_SRC_SHA: d58446e631b02cacc5355e373defc6092a684554
      OCAML_VERSION: '5.5.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: System packages and compiler fingerprint
        id: toolchain
        run: |
          brew list cmake >/dev/null 2>&1 || brew install cmake
          brew list ccache >/dev/null 2>&1 || brew install ccache
          fingerprint=$(c++ --version | shasum -a 256 | cut -d' ' -f1)
          echo "id=$fingerprint" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-macosx_10_15_x86_64-release-v4-${{ steps.toolchain.outputs.id }}-${{ hashFiles('CMakeLists.txt', 'runtime/**', 'tests/**/*.cpp', 'tests/**/*.hpp', 'tools/**/*.cpp', 'tools/**/*.hpp', 'deps/fetch.sh') }}
          restore-keys: ccache-macosx_10_15_x86_64-release-v4-${{ steps.toolchain.outputs.id }}-
      - uses: actions/cache/restore@v4
        with:
          path: |
            deps/math
            deps/stan
          key: deps-${{ runner.os }}-sources3-${{ hashFiles('deps/fetch.sh') }}
      - run: ./deps/fetch.sh
      - uses: actions/cache/restore@v4
        id: stanc-cache
        with:
          path: |
            deps/stanc3/stanc_embed.o
            deps/stanc3/stanc_embed.o.stamp
            deps/stanc3/stanc
            deps/stanc3/stanc.src
            deps/stanc3/stanli-vectorize-probe
            deps/stanc3/stanli-vectorize-probe.stamp
            deps/ocaml-include
          key: stanc-embed-v2-macosx_10_15_x86_64-${{ env.STANC3_SRC_SHA }}-ocaml${{ env.OCAML_VERSION }}-${{ hashFiles('compiler/native/**', 'compiler/ocaml/**', 'tools/stanc_embed/**') }}
      - name: Source-build compiler if exact cache is unavailable
        if: steps.stanc-cache.outputs.cache-hit != 'true'
        run: |
          brew list opam >/dev/null 2>&1 || brew install opam
          opam init --bare --disable-sandboxing --no-setup -y
          ./tools/dev_setup.sh --embed --no-build
          mkdir -p deps/ocaml-include
          cp -R "$(opam var lib --switch=stanc3-55)/ocaml/caml" deps/ocaml-include/
        env:
          OPAMYES: '1'
      - name: Verify compiler and build current runtime checker
        run: |
          source tools/stanc_embed/provenance.sh
          stanc_embed_artifact_matches deps/stanc3/stanc_embed.o "$STANC3_SRC_SHA" stanc3-55
          test "$(cat deps/stanc3/stanc.src)" = "$STANC3_SRC_SHA"
          export CCACHE_DIR="$PWD/.ccache" CCACHE_COMPRESS=1 CCACHE_MAXSIZE=600M
          export CCACHE_SLOPPINESS=pch_defines,time_macros,include_file_mtime,include_file_ctime
          cmake -B build-rel -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DSTANLI_STANC_EMBED_OBJ="$PWD/deps/stanc3/stanc_embed.o" \
            -DSTANLI_OCAML_STDLIB="$PWD/deps/ocaml-include"
          cmake --build build-rel --target stanli_check -j4
      - name: Fetch independent pinned CmdStan and input corpus
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/stan-dev/cmdstan.git deps/cmdstan-diagnosis
          git -C deps/cmdstan-diagnosis checkout d3d5df6a22565edbe13edbd4eb40762cc8c5a4d6
          git -C deps/cmdstan-diagnosis submodule update --init --recursive stan
          make -C deps/cmdstan-diagnosis -j4 stan/lib/stan_math/lib/tbb/libtbb.dylib
          git clone --filter=blob:none --no-checkout https://github.com/stan-dev/posteriordb.git deps/posteriordb-diagnosis
          git -C deps/posteriordb-diagnosis checkout 28f8d3d6e975315f42aa274a8399f21e07a43b30
      - name: Record three independent oracle and runtime evaluations
        run: |
          python3 tools/point_release_diagnosis.py \
            --cmdstan deps/cmdstan-diagnosis \
            --pdb deps/posteriordb-diagnosis/posterior_database \
            --check build-rel/stanli_check --stanc deps/stanc3/stanc \
            --output point-release-diagnosis
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: point-release-intel-diagnosis
          path: point-release-diagnosis/
          if-no-files-found: warn

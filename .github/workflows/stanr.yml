# Build the downstream stanr package with this checkout's vendored runtime,
# then run stanr's own stanli-backend contract tests. This catches source/API
# incompatibilities that the standalone R package cannot see: stanr embeds
# Stanli directly and adapts it to Stan's model_base interface.
#
# This runs only on demand. Release tags used to run it too, but stanr's
# vendoring script removes and patches stanli sources by name, and it has
# failed on every release since 0.27.0 while stanr saw little upstream work.
#
# The Windows row exists because stanr compiles the runtime into its own
# package DLL with Rtools (UCRT64 GCC), where thread_local objects live in
# emulated TLS and are torn down differently from Linux and macOS. A
# dispatch can point at another stanr revision and widen the test filter:
# `stanr_ref=b08398fa test_filter=show-exceptions` reproduces the worker
# crash andrjohns reported on his full-suite branch (stanli#349).
name: stanr downstream

on:
  workflow_dispatch:
    inputs:
      stanr_ref:
        description: 'stanr git revision to build against (default: the pin)'
        required: false
        default: ''
      stanr_repository:
        description: 'stanr repository to fetch (default: the pin)'
        required: false
        default: ''
      test_filter:
        description: testthat filter regex over stanr's test files
        required: false
        default: stanli-backend
      parallel:
        description: 'run testthat in parallel worker processes (TRUE/FALSE)'
        required: false
        default: 'TRUE'

permissions:
  contents: read

jobs:
  backend:
    name: current runtime in stanr (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    env:
      # Pin the downstream source so unrelated upstream changes cannot make a
      # Stanli release fail. Refresh this together with the test if stanr
      # changes its vendoring or backend contract.
      STANR_REF: ${{ inputs.stanr_ref || '86c8d99992904af6a72876287a97074f31888b5f' }}
      # Until andrjohns/stanr takes the Stan 2.40 update, the pin lives on
      # the seantalts fork.
      STANR_REPOSITORY: ${{ inputs.stanr_repository || 'https://github.com/seantalts/stanr.git' }}
      STANR_TEST_FILTER: ${{ inputs.test_filter || 'stanli-backend' }}
      TESTTHAT_PARALLEL: ${{ inputs.parallel || 'TRUE' }}
      MAKEFLAGS: -j4
      TESTTHAT_CPUS: 4
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
          extra-repositories: |
            https://stan-dev.r-universe.dev
            https://andytimm.r-universe.dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          dependencies: '"hard"'
          extra-packages: >-
            any::R6, any::QuickJSR, any::posterior, any::withr, any::testthat

      # R's default -g makes GCC run out of the runner's 16 GB at -j4 on the
      # Stan Math kernels. Without debug info the build peaks near 12 GB.
      - name: Build without debug info on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p ~/.R
          for v in CXXFLAGS CXX11FLAGS CXX14FLAGS CXX17FLAGS CXX20FLAGS; do
            echo "$v = -O2 -g0"
          done > ~/.R/Makevars

      - name: Build and test stanr's Stanli backend
        shell: bash
        run: ./tests/test_stanr.sh "$STANR_REF"

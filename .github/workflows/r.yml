# R CMD check for the R package on its supported desktop platforms.
#
# Deliberately without a runtime: the 16 MB library is downloaded only when
# the user asks for it, not built with the package. This job checks that the
# package installs, documents, and checks cleanly on its own. The sampling
# tests skip here and say so. They run for real in wheels.yml, against the .so
# that build job just produced, and that job fails if they skip.
#
# What does run here is the JavaScript compiler path: stanc3 through V8,
# which is the source-compilation path with no runtime dependency.
name: R

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'r/**'
      - 'compiler/js/**'
      - 'compiler/ocaml/**'
      - 'runtime/include/stanli/capi.h'
      - 'tools/dev_setup.sh'
      - 'tools/stanc_embed/**'
      - '.github/workflows/r.yml'
  pull_request:
    paths:
      - 'r/**'
      - 'compiler/js/**'
      - 'compiler/ocaml/**'
      - 'runtime/include/stanli/capi.h'
      - 'tools/dev_setup.sh'
      - 'tools/stanc_embed/**'
      - '.github/workflows/r.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Two constants that must agree and live in different languages in
  # different directories. The runtime and the R bridge are separately
  # versioned artifacts -- one is downloaded, the other is installed with
  # the R package --
  # so the bridge refuses to bind when the numbers disagree at runtime.
  # That guard is only as good as the number it compares against, and
  # bumping capi.h without bridge.c would make it accept a runtime it
  # should reject.
  abi:
    name: the ABI constants agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rt=$(sed -n 's/^#define STANLI_ABI_VERSION \([0-9]*\).*/\1/p' \
               runtime/include/stanli/capi.h)
          r=$(sed -n 's/^#define STANLI_R_ABI_VERSION \([0-9]*\).*/\1/p' \
              r/src/bridge.c)
          echo "runtime ${rt:-<none>}, R bridge ${r:-<none>}"
          [ -n "$rt" ] && [ "$rt" = "$r" ]

      - name: Verify the bundled JavaScript compiler provenance
        run: |
          source tools/stanc_embed/provenance.sh
          record=r/inst/js/stanc.js.src
          recorded() { sed -n "s/^$1=//p" "$record"; }
          expected_repo=$(sed -n \
            's/^STANC3_SRC_REPO=\([^ ]*\).*/\1/p' tools/dev_setup.sh)
          expected_revision=$(sed -n \
            's/^STANC3_SRC_SHA=\([0-9a-f]*\).*/\1/p' tools/dev_setup.sh)
          actual_sha=$(sha256sum r/inst/js/stanc.js | cut -d' ' -f1)

          [ -n "$expected_repo" ]
          [ -n "$expected_revision" ]
          [ "$(recorded format)" = stanli-portable-stancjs-v3 ]
          [ "$(recorded stanc3_src_repo)" = "$expected_repo" ]
          [ "$(recorded stanc3_src_sha)" = "$expected_revision" ]
          # Switch names are local labels; compiler versions below identify the toolchain.
          [ -n "$(recorded opam_switch)" ]
          [ "$(recorded ocaml_version)" = \
            "$(stanc_embed_read_setup OCAML_VERSION)" ]
          [ -n "$(recorded ocaml_target)" ]
          [ -n "$(recorded dune_version)" ]
          [ "$(recorded js_of_ocaml_version)" = 6.4.1 ]
          [ "$(recorded producer_inputs_sha256)" = \
            "$(stanli_stancjs_inputs_sha256)" ]
          [ "$(recorded dune_profile)" = release ]
          [ "$(recorded dune_subst)" = 1 ]
          [ "$(recorded artifact_sha256)" = "$actual_sha" ]
          ! grep -a -F -e '%%NAME%%' -e '%%VERSION%%' r/inst/js/stanc.js

  check:
    name: ${{ matrix.os }} (${{ matrix.r }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # --as-cran on one row only: it is the strictest and slowest,
          # and running it four times says the same thing four times.
          # That row also gets a LaTeX, because --as-cran builds the PDF
          # manual and a runner without pdflatex reports the absence as
          # an Rd problem ("LaTeX errors when creating PDF version"),
          # which is a WARNING and an ERROR for something the package
          # did not do. Providing pdflatex keeps this a meaningful package
          # check rather than an environment failure.
          - {os: ubuntu-latest,  r: 'release', args: '"--as-cran"', tex: true}
          - {os: ubuntu-latest,  r: 'devel',   args: '"--no-manual"'}
          - {os: macos-latest,   r: 'release', args: '"--no-manual"'}
          - {os: windows-latest, r: 'release', args: '"--no-manual"'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          http-user-agent: ${{ matrix.r == 'devel' && 'release' || 'default' }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-tinytex@v2
        if: matrix.tex

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: r
          args: ${{ matrix.args }}
          # One NOTE ("New submission") is expected; nothing else may appear.
          error-on: '"warning"'
          upload-snapshots: true

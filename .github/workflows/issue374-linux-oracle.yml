name: Issue 374 final GCC replay
'on':
  push:
    branches:
    - codex/issue374-linux-oracle
permissions:
  contents: read
  actions: read
  packages: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ghcr.io/seantalts/stanli-manylinux:2_28-x86_64
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CXX: g++
    steps:
    - uses: actions/checkout@v4
    - name: Download the current GCC runtime
      uses: actions/download-artifact@v4
      with:
        name: issue374-gcc-scalar-checker
        run-id: 35740129845
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path: build-rel
    - name: Test compiler identification and reference selection
      run: 'chmod +x build-rel/stanli_check

        test "$(./build-rel/stanli_check --compiler)" = gcc

        python3 tests/test_verify_refs.py'
    - name: Replay all 124 models at all three points
      run: python3 tools/issue374_gcc_replay.py
    - name: Save results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: issue374-gcc-final-results
        path: gcc-results/
        if-no-files-found: warn

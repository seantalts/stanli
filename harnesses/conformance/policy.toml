schema_version = 1
policy_version = "2026-08-15.1"

# Stan parameters are real-valued today.  Complex signatures need a separate
# source convention and a real projection before log-density parity has a
# well-defined meaning; stanli deliberately does not promise that surface yet.
[[classification]]
id = "complex-types"
status = "expected_unsupported"
reason = "Complex arguments and results are outside stanli's current runtime contract."
contains_complex = true

# Tuple results require destructuring and lane-wise reduction.  They are kept
# visible as a reviewed product boundary until the runtime and generator both
# have tuple value support.  Complex tuples are owned by the preceding rule.
[[classification]]
id = "tuple-results"
status = "expected_unsupported"
reason = "Tuple-valued results are not represented by stanli's value graph."
return_kind = "tuple"
contains_complex = false

# Two correct adaptive integrators at rtol 1e-6 each carry their own
# O(rtol) discretization error, so their answers may legitimately differ
# by that order even when both converge to the same solution.  Measured
# on the mixed variadic rk45 construct at theta = 0: the reference moves
# 2.8e-7 between rtol 1e-6 and 1e-12, and stanli's loose answer sits
# 2.5e-8 from the converged solution -- eight times closer than the
# reference's own 2.1e-7.  The earlier 1e-9 was inherited from
# harnesses/ode_sweep.py, which measures the SAME implementation against
# itself and so never sees cross-implementation step-control differences.
[[numeric_gate]]
id = "iterative-ode-solvers"
reason = "Adaptive integrators carry O(rtol) discretization error each; the difference of two correct solves is that order."
name_regex = "^(ode_|integrate_ode)"
abs_tol = 1e-9
rel_tol = 1e-6

# The wiener first-passage density's gradients on near-zero lanes differ
# by up to a few hundred ULP between stanli's kernel and the reference:
# same stan-math templates, different container instantiations and
# optimization contexts (reference models compile at O=1, the runtime at
# O2/O3).  Verified value-level agreement on arm64/clang where the same
# rows are bitwise-adjacent; the divergence is toolchain-level, not
# semantic.  The 0.11-relative element-broadcast bug this suite caught
# in the same kernel sits eleven orders of magnitude above this gate.
[[numeric_gate]]
id = "wiener-instantiation-drift"
reason = "Cross-instantiation/toolchain drift on near-zero gradient lanes; hundreds of ULP at ~1e-17 absolute."
name_regex = "^wiener_lpdf$"
rel_tol = 1e-12

# inv_Phi's forward is literally the same stan-math call on both sides;
# the deep-vectorized probes' weighted-sum trees leave up to ~7e-15
# relative between the two evaluations of the same arithmetic.
# std_normal_qf is stanc3's alias for inv_Phi -- Lower_expr.ml emits
# stan::math::inv_Phi for it and stanli lowers it to the same opcode, so
# the reference and the runtime are running the identical call under both
# names. It measures the same 7.29e-15, on the same weighted-sum trees,
# with gradients that agree exactly.
[[numeric_gate]]
id = "inv-phi-probe-depth"
reason = "Deep probe expression trees over an identical forward call; last-bit accumulation only."
name_regex = "^(inv_Phi|std_normal_qf)$"
rel_tol = 1e-13

# The bound transforms called as functions. stanli composes the inverse
# direction from elementwise ops -- stan-math has no rev overloads for
# lb_free/ub_free/lub_free, so its own `logit((y - lb) / (ub - lb))` is
# ordinary var arithmetic and the composition is the reference rather than
# an approximation of it. The formulas match term for term, and OP_LOGIT
# calls stan::math::logit itself.
#
# What is left is the probe, not the transform. These signatures produce
# outputs that straddle zero, so the generated model's weighted sum cancels
# three digits out of lanes of order 0.1 and a last-bit difference becomes
# a large relative one. Measured across the 29 rows: worst 1.735e-15
# absolute, 3.69e-14 relative. An absolute gate is the honest metric for a
# cancelling sum -- ULP and relative both describe the cancellation rather
# than the disagreement -- and 1e-13 leaves two orders of headroom.
#
# The fma half of this class is fixed at source rather than gated: the
# reference now compiles from the same --O1 MIR stanli reads. That removed
# 28 of the original 57 here and all 9 on upper_bound_jacobian. The second
# source of last-bit difference behind these 29 is not identified; it is a
# gate on a known-small quantity, not an explanation.
[[numeric_gate]]
id = "bound-transform-probe-cancellation"
reason = "Probe outputs straddle zero, so the weighted sum cancels and a last-bit difference reads as a large relative one."
name_regex = "^(lower_bound|upper_bound|lower_upper_bound|offset_multiplier)_(constrain|unconstrain|jacobian)$"
abs_tol = 1e-13
